<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kenaz / Kameas AI brand mark — 4×4 dot grid in cream (#F4F1EA).
  Dot radius bumped from 2.5 to 5 (compared to the kenaz.kameas.ai
  hero SVG) so the mark stays legible when scaled down to the 24px
  Docusaurus navbar slot on mobile high-DPI screens. At desktop the
  bigger dots still look correct against the same grid spacing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <circle cx="8" cy="8" r="5" fill="#F4F1EA"/>
  <circle cx="24" cy="8" r="5" fill="#F4F1EA"/>
  <circle cx="40" cy="8" r="5" fill="#F4F1EA"/>
  <circle cx="56" cy="8" r="5" fill="#F4F1EA"/>
  <circle cx="8" cy="24" r="5" fill="#F4F1EA"/>
  <circle cx="24" cy="24" r="5" fill="#F4F1EA"/>
  <circle cx="40" cy="24" r="5" fill="#F4F1EA"/>
  <circle cx="56" cy="24" r="5" fill="#F4F1EA"/>
  <circle cx="8" cy="40" r="5" fill="#F4F1EA"/>
  <circle cx="24" cy="40" r="5" fill="#F4F1EA"/>
  <circle cx="40" cy="40" r="5" fill="#F4F1EA"/>
  <circle cx="56" cy="40" r="5" fill="#F4F1EA"/>
  <circle cx="8" cy="56" r="5" fill="#F4F1EA"/>
  <circle cx="24" cy="56" r="5" fill="#F4F1EA"/>
  <circle cx="40" cy="56" r="5" fill="#F4F1EA"/>
  <circle cx="56" cy="56" r="5" fill="#F4F1EA"/>
</svg>
