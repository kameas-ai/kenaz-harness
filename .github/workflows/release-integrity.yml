name: release-integrity
# kameas-ci: maintenance

# Reconciles git tags against published GitHub Releases and FAILS when a tag
# has no downloadable artifacts.
#
# The gap this closes: tag-on-merge.yml pushes the tag, dispatches release.yml,
# and exits green — it never learns whether the release actually shipped. When
# release.yml broke on 2026-08-02, eleven tags were cut over four days with
# nothing published, and every check stayed green. Silence read as success.
#
# This workflow is the thing that makes silence audible: a failure here turns
# into a red run in the Actions tab.
#
# MANUAL ONLY (owner decision 2026-10-30: no schedules, no workflow_run
# chaining). Run it after a release (or any time you want to audit tags vs
# releases): gh workflow run release-integrity.yml --ref main. The script
# treats an already-failed release run as out-of-grace, so running it right
# after a failed Release reports immediately.

on:
  workflow_dispatch:
    inputs:
      grace_minutes:
        description: 'Minutes a tag may go unreleased before it is failed'
        required: false
        default: '90'

permissions:
  contents: read
  actions: read

# Cancel superseded runs: a new dispatch on the same branch cancels the
# in-flight one; runs on main queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reconcile:
    name: Tags vs published releases
    runs-on: ${{ fromJson(vars.CI_RUNNER_FAST || '["self-hosted","Linux","ARM64","ci-fast"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # The self-hosted ARM64 ci-fast runner image lacks the gh CLI. Install on
      # demand — same pattern as tag-on-merge.yml and release.yml. Once
      # kameas-infra bakes gh into the runner AMI this step can be deleted.
      - name: install gh CLI if missing
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh already installed: $(gh --version | head -n1)"
            exit 0
          fi
          GH_VERSION="2.62.0"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::unsupported arch: $ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${ARCH}.tar.gz" -o /tmp/gh.tgz
          tar -xzf /tmp/gh.tgz -C /tmp
          sudo install -m 755 "/tmp/gh_${GH_VERSION}_linux_${ARCH}/bin/gh" /usr/local/bin/gh
          gh --version | head -n1

      - name: reconcile tags against releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GRACE_MINUTES: ${{ inputs.grace_minutes || '90' }}
        run: bash scripts/ci/check-release-integrity.sh
