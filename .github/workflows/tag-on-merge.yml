name: tag-on-merge
# kameas-ci: deploy

# NOTE (2026-07-24): reverted from the shared reusable workflow
# (kameas-ai/.github/.github/workflows/tag-on-merge.yml, adopted in #247) back
# to this inline implementation. The reusable caller failed at startup here with
# `referenced_workflows: []` — GitHub could not resolve the private reusable
# workflow for THIS repo — while kenaz-workbench's byte-identical caller resolved
# and tagged fine. Every API-visible setting (Actions permissions, .github access
# level, caller permissions) matches workbench, so the block is a harness-specific
# access quirk to the private .github repo that isn't visible via the API. Two
# merges (#247, v0.45.1) shipped untagged as a result. Re-adopt the reusable once
# harness's access to kameas-ai/.github reusable workflows is fixed at the org/
# repo-admin level. Until then this inline copy (the version that tagged through
# v0.45.0) is the source of truth; keep it in sync with the shared one.
#
# Cuts a SemVer tag + GitHub Release from the conventional commits merged
# since the last release, then dispatches release.yml (prod publish).
#
# MANUAL ONLY (owner decision 2026-10-30; the AUTO_RELEASE push-to-main path
# is gone): Actions → tag-on-merge → "Run workflow" on main, or
#   gh workflow run tag-on-merge.yml -R kameas-ai/kenaz-harness --ref main \
#     [-f bump=auto|patch|minor|major]
#
# Mapping (squash-merged PR title becomes the commit subject verbatim):
#   feat(scope)?:        → minor (0.x.0)
#   fix|perf|revert|deps → patch (0.x.y)
#   feat!: / BREAKING CHANGE in body → major, capped to minor while < 1.0.0
#   docs|chore|ci|style|refactor|test|build → no release
#
# Source of truth: git tags. The next version = bump(latest `vX.Y.Z` tag).
# No CHANGELOG file maintained — release notes are GitHub's auto-generated
# "What's Changed" body (groups by PR + contributor).
#
# After tagging, dispatches release.yml against the new tag so the cross-
# platform signed binaries attach to the proper release. (GITHUB_TOKEN-issued
# release events do not chain — explicit workflow_dispatch is required.)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump. auto = highest conventional-commit bump since the last tag.'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: tag-on-merge
  cancel-in-progress: false

jobs:
  bump-and-release:
    name: Bump version + cut release
    # Manual runs must be on main; the classify step fails loudly otherwise.
    runs-on: ${{ fromJson(vars.CI_RUNNER_FAST || '["self-hosted","Linux","ARM64","ci-fast"]') }}
    permissions:
      contents: write     # tag + release
      actions: write      # workflow_dispatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0  # tags + history needed to find the latest tag

      - name: classify commits + compute next version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          # Empty on push; auto|patch|minor|major on workflow_dispatch.
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release from main only (this run is on $GITHUB_REF). Re-run with --ref main."
            exit 1
          fi

          # Latest semver tag reachable from HEAD (default v0.0.0 if none) — a
          # hotfix tag on a side branch must not become the base.
          LAST=$(git tag --merged HEAD --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          LAST=${LAST:-v0.0.0}

          # HEAD already carries a release tag → nothing to cut (a re-run, or a
          # manual dispatch right after an automatic tag).
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            echo "::warning::HEAD is already tagged $EXISTING; nothing new to tag. To rebuild it: gh workflow run release.yml --ref $EXISTING -f version=$EXISTING"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            echo "existing_tag=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Classify EVERY commit since LAST and take the highest bump. On an
          # automatic (per-merge) run this is just the merged commit plus any
          # non-releasing commits before it; on a manual run with
          # AUTO_RELEASE off it is every merge that has accumulated since the
          # last release. --first-parent walks main's own history, so a
          # merge-commit PR is classified by its merge subject (the PR title)
          # and squash/rebase merges by their commits.
          if git rev-parse -q --verify "refs/tags/$LAST" >/dev/null; then
            RANGE="$LAST..HEAD"
          else
            RANGE="HEAD"
          fi
          # Parse conventional-commit prefix:
          #   <type>[(scope)][!]: <subject>
          # Hold the regex in a variable — bash's `[[ =~ ]]` parser chokes
          # on nested `[[:space:]]` POSIX classes when the regex is inline
          # (the `[[` is misread as a nested test expression).
          re='^([a-z]+)(\([^)]+\))?(!?):[[:space:]]'
          rank() { case "$1" in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; *) echo 0 ;; esac; }
          BUMP="none"
          FORCED=false
          BREAKING=false
          COUNT=0
          while read -r SHA; do
            COUNT=$((COUNT+1))
            # Skip self-tagging-bot commits.
            if [[ "$(git log -1 --pretty=%ae "$SHA")" == *"github-actions[bot]"* ]]; then
              continue
            fi
            SUBJECT=$(git log -1 --pretty=%s "$SHA")
            BODY=$(git log -1 --pretty=%B "$SHA" | tail -n +3)
            [[ "$SUBJECT" =~ $re ]] || continue
            TYPE="${BASH_REMATCH[1]}"
            BANG="${BASH_REMATCH[3]}"
            case "$TYPE" in
              feat)                 B="minor" ;;
              fix|perf|revert|deps) B="patch" ;;
              *)                    B="none"  ;;
            esac
            # Breaking: trailing `!` after type/scope, or BREAKING CHANGE /
            # BREAKING-CHANGE token in the commit body.
            if [ -n "$BANG" ] || echo "$BODY" | grep -qE '^BREAKING[ -]CHANGE:'; then
              B="major"
              BREAKING=true
            fi
            echo "  ${SHA:0:7} $B  $SUBJECT"
            if [ "$(rank "$B")" -gt "$(rank "$BUMP")" ]; then BUMP="$B"; fi
          done < <(git rev-list --first-parent "$RANGE")
          echo "Classified $COUNT commit(s) in $RANGE → bump=$BUMP"

          # A manual dispatch may force the bump level (e.g. to ship an
          # accumulation of chore/build commits).
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$BUMP_INPUT" ] && [ "$BUMP_INPUT" != "auto" ]; then
            echo "::notice::bump forced to '$BUMP_INPUT' by workflow_dispatch input (computed: $BUMP)"
            BUMP="$BUMP_INPUT"
            FORCED=true
          fi

          if [ "$BUMP" = "none" ]; then
            echo "No release-worthy commits in $RANGE."
            [ "$EVENT" = "workflow_dispatch" ] && echo "::warning::No feat/fix/perf/revert/deps commits since $LAST — nothing tagged. Re-run with bump=patch|minor|major to force one."
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=${LAST#v}
          IFS=. read -r MAJ MIN PAT <<<"$BASE"

          # Pre-1.0 cap: breaking bumps minor instead of major while at 0.x.
          # A manually forced bump=major is honoured (that is how 1.0.0 ships).
          if [ "$MAJ" = "0" ] && [ "$BUMP" = "major" ] && [ "$FORCED" != true ]; then
            BUMP="minor"
            echo "::notice::Pre-1.0 cap — breaking change bumps minor instead of major"
          fi

          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          NEXT="v${MAJ}.${MIN}.${PAT}"

          echo "Last tag: $LAST → next: $NEXT (bump=$BUMP, breaking=$BREAKING)"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LAST" >> "$GITHUB_OUTPUT"
          {
            echo "## tag-on-merge ($EVENT)"
            echo ""
            echo "- commits: $COUNT in \`$RANGE\`"
            echo "- bump: \`$BUMP\` (breaking=$BREAKING)"
            echo "- $LAST → **$NEXT**"
          } >> "$GITHUB_STEP_SUMMARY"

      # Workaround: self-hosted ARM64 ci-fast runner image lacks the gh CLI,
      # which the `generate release notes` and `tag + release` steps below
      # both rely on. Install on demand. Once kameas-infra bakes gh into the
      # runner AMI, this step can be deleted (mirrors release.yml:807).
      - name: install gh CLI if missing
        if: steps.ver.outputs.bump != 'none'
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh already installed: $(gh --version | head -n1)"
            exit 0
          fi
          GH_VERSION="2.62.0"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::unsupported arch: $ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${ARCH}.tar.gz" -o /tmp/gh.tgz
          tar -xzf /tmp/gh.tgz -C /tmp
          sudo install -m 755 "/tmp/gh_${GH_VERSION}_linux_${ARCH}/bin/gh" /usr/local/bin/gh
          gh --version | head -n1

      - name: generate release notes
        if: steps.ver.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:  ${{ steps.ver.outputs.tag }}
          PREV: ${{ steps.ver.outputs.previous_tag }}
        run: |
          set -euo pipefail
          # GitHub auto-generates "What's Changed" notes from PRs since
          # PREV. Falls back to a stub if PREV is the v0.0.0 sentinel
          # (no prior tag yet).
          if [ "$PREV" = "v0.0.0" ] && ! git rev-parse "$PREV" >/dev/null 2>&1; then
            echo "Initial release $TAG." > notes.md
          else
            gh api -X POST repos/$GITHUB_REPOSITORY/releases/generate-notes \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$PREV" \
              --jq .body > notes.md \
              || echo "Automated release for $TAG." > notes.md
          fi

      - name: tag + release
        if: steps.ver.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          # Created as a DRAFT on purpose. release.yml's `release` job flips it
          # to published (and decides "latest") only after every platform
          # asset + manifest.json is uploaded. A published-then-filled Release
          # was visible ~10 min before it had any assets, and any build
          # failure left a permanent zero-asset Release (see
          # .github/release-integrity-ignore.txt). A failed build now leaves
          # an invisible draft that a re-run of release.yml completes.
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: dispatch release.yml for binary build
        if: steps.ver.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f version="$TAG"
          echo "Dispatched release.yml for $TAG"
