name: tag-on-merge

# Cuts a SemVer tag + GitHub Release on every release-worthy conventional-commit
# merge to main, then dispatches release.yml so the signed cross-platform
# binaries build and publish to the prod downloads CDN.
#
# The logic now lives in the shared reusable workflow so every desktop product
# (kenaz-harness, kenaz-workbench, …) stays in lockstep. Previously this file
# carried the full inline implementation; it was extracted verbatim into
# kameas-ai/.github/.github/workflows/tag-on-merge.yml. Harness runs on the
# shared self-hosted ci-fast pool, which is the reusable workflow's default, so
# no inputs are needed.

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag-on-merge:
    uses: kameas-ai/.github/.github/workflows/tag-on-merge.yml@main
    secrets: inherit
