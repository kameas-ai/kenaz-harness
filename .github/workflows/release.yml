name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. v0.1.0). Leave empty to derive from sha.'
        required: false
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  derive-version:
    name: Derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      is_release: ${{ steps.set.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            IS_RELEASE=true
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            IS_RELEASE=true
          else
            SHORT_SHA=$(git rev-parse --short=8 HEAD)
            DATE=$(date -u +%Y%m%d)
            VERSION="v0.0.0-main-${DATE}-${SHORT_SHA}"
            IS_RELEASE=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (release=${IS_RELEASE})"

  build:
    name: Build ${{ matrix.label }}
    needs: [derive-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
            wails_platform: linux/amd64
            artifact_glob: 'build/bin/*'
            archive_ext: tar.gz
          - os: macos-13 # Intel runner
            label: darwin-amd64
            wails_platform: darwin/amd64
            artifact_glob: 'build/bin/*.app'
            archive_ext: zip
          - os: macos-14 # Apple Silicon runner
            label: darwin-arm64
            wails_platform: darwin/arm64
            artifact_glob: 'build/bin/*.app'
            archive_ext: zip
          - os: windows-latest
            label: windows-amd64
            wails_platform: windows/amd64
            artifact_glob: 'build/bin/*.exe'
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write   # required for Azure OIDC federation on Windows signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: install wails system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: frontend deps
        working-directory: frontend
        run: npm ci

      - name: wails build
        shell: bash
        run: |
          VERSION="${{ needs.derive-version.outputs.version }}"
          # Pass version via -ldflags so main.go can surface it.
          wails build \
            -platform ${{ matrix.wails_platform }} \
            -ldflags "-X main.Version=${VERSION}" \
            -trimpath \
            -tags ${{ runner.os == 'Linux' && 'webkit2_41' || '' }}

      # ── Windows code signing (Microsoft Artifact Signing / Trusted Signing) ──
      # Skips silently when AZURE_CLIENT_ID is not set, so the workflow
      # works pre-enrollment. Once identity validation completes and the
      # five AZURE_* secrets are populated, this step signs every .exe
      # in build/bin via Azure-hosted HSM (no local cert).
      - name: azure login (OIDC) — windows only
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: artifact signing (windows .exe)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: build/bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: signing skipped notice (windows, secrets missing)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID == ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: bash
        run: |
          echo "::notice::Windows binary not signed — AZURE_CLIENT_ID secret not set."
          echo "Add AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_TRUSTED_SIGNING_ENDPOINT,"
          echo "AZURE_TRUSTED_SIGNING_ACCOUNT, AZURE_TRUSTED_SIGNING_PROFILE to enable."

      - name: archive (linux/macos)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.derive-version.outputs.version }}"
          LABEL="${{ matrix.label }}"
          STAGE="kaneaz-harness-${VERSION}-${LABEL}"
          mkdir -p dist
          mv build/bin "${STAGE}"
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          else
            zip -r "dist/${STAGE}.zip" "${STAGE}"
          fi
          ls -la dist/

      - name: archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.derive-version.outputs.version }}"
          $label   = "${{ matrix.label }}"
          $stage   = "kaneaz-harness-$version-$label"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Rename-Item build/bin $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"
          Get-ChildItem dist

      - name: checksum
        shell: bash
        run: |
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaneaz-harness-${{ matrix.label }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [derive-version, build]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.create.outputs.tag }}
      release_url: ${{ steps.create.outputs.url }}
      asset_manifest: ${{ steps.manifest.outputs.json }}
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-flat
          pattern: kaneaz-harness-*
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist-flat/

      - name: create or update release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ needs.derive-version.outputs.version }}"
          IS_RELEASE="${{ needs.derive-version.outputs.is_release }}"

          if [ "$IS_RELEASE" = "true" ]; then
            # Tagged release: upload to existing release if possible, otherwise create.
            TAG="$VERSION"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --title "$TAG" \
                --notes "Automated release from main." \
                --target "$GITHUB_SHA"
            fi
            gh release upload "$TAG" dist-flat/* --clobber
            URL=$(gh release view "$TAG" --json url --jq .url)
          else
            # Pre-release rolling channel: replace the "main" prerelease.
            TAG="main"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --yes --cleanup-tag
            fi
            gh release create "$TAG" \
              --title "main (rolling, $VERSION)" \
              --notes "Rolling build from main. Not a stable release." \
              --prerelease \
              --target "$GITHUB_SHA" \
              dist-flat/*
            URL=$(gh release view "$TAG" --json url --jq .url)
          fi

          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "url=$URL"   >> "$GITHUB_OUTPUT"

      - name: build asset manifest for docs site
        id: manifest
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
          TAG:     ${{ steps.create.outputs.tag }}
        run: |
          # Emit a JSON manifest the docusaurus site consumes.
          # One record per platform with download URL + sha256.
          python3 - <<'PY' > manifest.json
          import json, os, pathlib, re
          tag = os.environ['TAG']
          version = os.environ['VERSION']
          repo = os.environ.get('GITHUB_REPOSITORY', 'kameas-ai/kaneaz-harness')
          base = f"https://github.com/{repo}/releases/download/{tag}"
          dist = pathlib.Path('dist-flat')
          assets = []
          for f in sorted(dist.iterdir()):
              if f.suffix == '.sha256':
                  continue
              sha_path = dist / f"{f.name}.sha256"
              sha = ''
              if sha_path.exists():
                  sha = sha_path.read_text().split()[0]
              # Parse label from filename: kaneaz-harness-<version>-<label>.<ext>
              m = re.match(r'kaneaz-harness-.+?-(linux|darwin|windows)-(amd64|arm64)\.(.+)$', f.name)
              if not m:
                  continue
              os_label, arch, ext = m.groups()
              assets.append({
                  'platform': f"{os_label}-{arch}",
                  'os': os_label,
                  'arch': arch,
                  'filename': f.name,
                  'url': f"{base}/{f.name}",
                  'sha256': sha,
                  'ext': ext,
                  'size_bytes': f.stat().st_size,
              })
          manifest = {
              'version': version,
              'tag': tag,
              'commit': os.environ.get('GITHUB_SHA', ''),
              'released_at': os.environ.get('GITHUB_RUN_STARTED_AT', ''),
              'release_url': f"https://github.com/{repo}/releases/tag/{tag}",
              'assets': assets,
          }
          print(json.dumps(manifest, indent=2))
          PY
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          cat manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF"        >> "$GITHUB_OUTPUT"
          # Also upload the manifest as a release asset so the docs site
          # can fetch it without needing a token.
          gh release upload "${{ steps.create.outputs.tag }}" manifest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-docs:
    name: Notify docusaurus site
    needs: [derive-version, release]
    runs-on: ubuntu-latest
    # Only fire for tagged releases or main rolling builds.
    if: needs.derive-version.outputs.is_release == 'true' || github.event_name == 'push'
    steps:
      - name: dispatch update to kenaz-docs
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DOCS_TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN not set — skipping docs dispatch."
            echo "To enable: add a PAT with 'repo' scope on kameas-ai/kenaz-docs as DOCS_DISPATCH_TOKEN secret on this repo."
            exit 0
          fi

          # repository_dispatch into kenaz-docs; that repo's workflow
          # consumes type "kaneaz-harness-release" + the manifest payload
          # to update its download page.
          curl -fsSL -X POST \
            -H "Authorization: token ${DOCS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kameas-ai/kenaz-docs/dispatches \
            -d @- <<EOF
          {
            "event_type": "kaneaz-harness-release",
            "client_payload": {
              "version": "${{ needs.derive-version.outputs.version }}",
              "tag":     "${{ needs.release.outputs.release_tag }}",
              "release_url": "${{ needs.release.outputs.release_url }}",
              "manifest_url": "https://github.com/kameas-ai/kaneaz-harness/releases/download/${{ needs.release.outputs.release_tag }}/manifest.json",
              "is_release": ${{ needs.derive-version.outputs.is_release }}
            }
          }
          EOF
