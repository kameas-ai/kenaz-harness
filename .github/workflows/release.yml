name: Release

on:
  # release-please owns version bumps; this workflow only runs against
  # real semver tags. Three entry points:
  #   1. release-please dispatches it via `gh workflow run release.yml --ref vX.Y.Z`
  #      after merging a release PR (the primary path).
  #   2. A human creates a Release in the GitHub UI (manual path; rare).
  #   3. workflow_dispatch with an explicit version (escape hatch / re-run).
  # No more `push: branches: [main]` — non-versioning merges (chore/docs/ci/etc.)
  # do not produce binaries; PR-time `build-smoke` covers build-health verification.
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build (e.g. v0.1.0). Required.'
        required: true
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Match go.mod (currently 1.25.0). Bumping here when go.mod bumps.
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  derive-version:
    name: Derive version
    runs-on: [self-hosted, Linux, ARM64, ci-fast]
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            echo "::error::release.yml expects either a release event or a workflow_dispatch with version=vX.Y.Z"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::version '$VERSION' is not a valid SemVer tag (vX.Y.Z[-pre])"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  build:
    name: Build ${{ matrix.label }}
    needs: [derive-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
            wails_platform: linux/amd64
            artifact_glob: 'build/bin/*'
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            label: linux-arm64
            wails_platform: linux/arm64
            artifact_glob: 'build/bin/*'
            archive_ext: tar.gz
          # Cross-compile both Mac architectures from Apple Silicon runners.
          # macos-13 (Intel) hosted runners have been intermittently
          # unschedulable — observed runs sitting queued >50 min with no
          # runner ever assigned. macos-14 / macos-latest run Apple Silicon
          # and Go cross-compiles to darwin/amd64 fine; Wails ships its
          # macOS SDK headers regardless of build host arch.
          - os: macos-latest
            label: darwin-amd64
            wails_platform: darwin/amd64
            artifact_glob: 'build/bin/*.app'
            archive_ext: zip
          - os: macos-latest
            label: darwin-arm64
            wails_platform: darwin/arm64
            artifact_glob: 'build/bin/*.app'
            archive_ext: zip
          - os: windows-latest
            label: windows-amd64
            wails_platform: windows/amd64
            artifact_glob: 'build/bin/*.exe'
            archive_ext: zip
          # Cross-compile to Windows arm64 from the x86 runner (Wails
          # supports it; no separate runner needed). Trusted Signing's
          # signtool handles arm64 PE files transparently — same step,
          # same secrets, no Windows-arm64 runner required.
          - os: windows-latest
            label: windows-arm64
            wails_platform: windows/arm64
            artifact_glob: 'build/bin/*.exe'
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write   # required for Azure OIDC federation on Windows signing
    # Lift the gating-only secrets to job-level env so step `if:`
    # expressions can read them. GitHub evaluates step `if:` *before*
    # the step's own `env:` block is materialized, so per-step
    # `env: APPLE_CERT_P12: ${{ secrets... }}` is invisible to its
    # own `if: env.APPLE_CERT_P12 != ''`. Only checking presence here;
    # the secret value still flows into `secrets.*` references that
    # need it.
    env:
      APPLE_CERT_P12_PRESENT: ${{ secrets.APPLE_CERT_P12 != '' }}
      AZURE_CLIENT_ID_PRESENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: install wails system deps (linux)
        if: runner.os == 'Linux'
        run: |
          # ubuntu-latest moved to 24.04, which ships libwebkit2gtk-4.1
          # (not 4.0). Pair with the `webkit2_41` build tag below.
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: install wails CLI
        # Pin to the same version we've validated locally; @latest can ship
        # breaking generator changes (the Wails CLI emits TS bindings, etc.).
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: frontend deps
        working-directory: frontend
        run: npm ci

      # Sync wails.json info.productVersion to the resolved release
      # version BEFORE wails build, so the OS-visible bundle metadata
      # (CFBundleShortVersionString on macOS, FileVersion on Windows)
      # matches the tag instead of the source-tree default. Stable tag
      # builds: source already matches (release-please bumped it). Rolling
      # main builds: source is the last release version, so we overwrite
      # with the rolling label here.
      #
      # Wails enforces a numeric productVersion (X.Y.Z[.W]); strip the
      # leading "v" and any rolling/prerelease suffix before writing.
      - name: sync wails.json productVersion
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.derive-version.outputs.version }}"
          NUMERIC=$(echo "$VERSION" | sed -E 's/^v//; s/-.*$//')
          if ! [[ "$NUMERIC" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::derived numeric version '$NUMERIC' is not X.Y.Z; leaving wails.json untouched"
            exit 0
          fi
          tmp=$(mktemp)
          jq --arg v "$NUMERIC" '.info.productVersion = $v' wails.json > "$tmp" && mv "$tmp" wails.json
          echo "wails.json info.productVersion → $NUMERIC"

      - name: wails build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.derive-version.outputs.version }}"
          # The -tags flag is only valid with an argument. Linux needs
          # webkit2_41 (gtk 4.1); macOS + Windows want no tags. Build the
          # arg list conditionally so we don't emit a bare `-tags` on
          # platforms that don't need one.
          ARGS=(
            -platform "${{ matrix.wails_platform }}"
            -ldflags "-X main.Version=${VERSION}"
            -trimpath
          )
          if [ "${{ runner.os }}" = "Linux" ]; then
            ARGS+=(-tags webkit2_41)
          fi
          wails build "${ARGS[@]}"

      # ── Linux AppImage (linux/amd64 only) ────────────────────────────────
      # Produces a self-contained, portable AppImage alongside the tarball.
      # linux/arm64 ships tarball-only in this PR; the AppDir scaffold and
      # appimagetool for arm64 require a cross-tool chain not yet validated.
      # Linux binaries are not codesigned; users may need to `chmod +x`.
      - name: build AppImage (linux-amd64 only)
        if: runner.os == 'Linux' && matrix.wails_platform == 'linux/amd64'
        run: |
          set -euo pipefail
          VERSION="${{ needs.derive-version.outputs.version }}"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          APPDIR="build/bin/Kenaz_Harness.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          # wails build outputs to build/bin/Kenaz on Linux
          # (productName="Kenaz Harness", outputfilename="Kenaz" in wails.json).
          cp "build/bin/Kenaz" "$APPDIR/usr/bin/kenaz-harness"
          cp build/appicon.png "$APPDIR/Kenaz_Harness.png"
          cp build/appicon.png "$APPDIR/.DirIcon"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/kenaz-harness" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/kenaz-harness.desktop" <<'EOF'
          [Desktop Entry]
          Name=Kenaz Harness
          Exec=kenaz-harness
          Icon=Kenaz_Harness
          Type=Application
          Categories=Development;
          EOF

          ARCH=x86_64 /tmp/appimagetool --no-appstream \
            "$APPDIR" \
            "build/bin/Kenaz-Harness-${VERSION}-linux-amd64.AppImage"
          echo "AppImage produced: $(ls -lh "build/bin/Kenaz-Harness-${VERSION}-linux-amd64.AppImage")"

      # ── kenaz-updater.exe (Windows only) ────────────────────────────────
      # Stand-alone helper binary that performs the wait-rename-relaunch
      # outside the harness process. Bundled into the same build/bin/ dir
      # so the existing Trusted Signing step picks it up via
      # `files-folder-filter: exe` and the archive (windows) step zips it
      # into the release artifact alongside the main exe. See
      # cmd/kenaz-updater/main.go and core/update/swap_windows.go.
      - name: build kenaz-updater (windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.derive-version.outputs.version }}"
          # Match the wails-build target arch (matrix.wails_platform is
          # windows/amd64 or windows/arm64). Cross-compile the helper
          # accordingly so a windows-arm64 install ships an arm64 helper.
          PLATFORM="${{ matrix.wails_platform }}"
          GOARCH="${PLATFORM##*/}"
          GOOS=windows GOARCH="${GOARCH}" \
            go build \
              -ldflags="-X main.version=${VERSION}" \
              -trimpath \
              -o "build/bin/kenaz-updater.exe" \
              ./cmd/kenaz-updater
          ls -la build/bin/kenaz-updater.exe

      # ── Windows NSIS installer ────────────────────────────────────────────
      # Builds a second output (NSIS-backed installer.exe) alongside the bare
      # binary. Only for amd64 — arm64 ships tarball-only in this release.
      # The Trusted Signing step below uses `files-folder-filter: exe` which
      # picks up ALL .exe files in build/bin, so the installer gets signed
      # without any extra configuration.
      # GitHub-hosted windows-latest runners do NOT pre-install NSIS. v0.5.1
      # release.yml run silently emitted "Warning: Cannot create installer:
      # makensis not found" and produced no .exe; the next step's hard-error
      # path-check then failed the job. Install NSIS via chocolatey here so
      # `wails build -nsis` actually has makensis on PATH.
      - name: install NSIS toolchain (windows-amd64 only)
        if: runner.os == 'Windows' && matrix.wails_platform == 'windows/amd64'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsisPath\makensis.exe") {
            Add-Content $env:GITHUB_PATH $nsisPath
            & "$nsisPath\makensis.exe" /VERSION
          } else {
            Write-Error "makensis.exe not found at expected $nsisPath after choco install"
            exit 1
          }

      - name: wails build (nsis installer, windows-amd64 only)
        if: runner.os == 'Windows' && matrix.wails_platform == 'windows/amd64'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.derive-version.outputs.version }}"
          wails build -platform ${{ matrix.wails_platform }} -nsis \
            -ldflags "-X main.Version=${VERSION}" \
            -trimpath

      - name: rename NSIS installer for clean asset name (windows-amd64 only)
        if: runner.os == 'Windows' && matrix.wails_platform == 'windows/amd64'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.derive-version.outputs.version }}"
          # Wails picks the installer filename from wails.json `name` field
          # ("kenaz-harness"), NOT productName ("Kenaz Harness") and NOT
          # outputfilename ("Kenaz"). Both prior fixes used the wrong field
          # (v0.5.0 used productName, v0.5.1 used outputfilename, both
          # silently failed). Use a glob match so we don't have to keep
          # guessing which wails.json field NSIS reads from.
          DST="build/bin/Kenaz-Harness-Setup-${VERSION}-windows-amd64.exe"
          # Find the *-amd64-installer.exe Wails just produced (exactly one expected).
          shopt -s nullglob
          installers=( build/bin/*-amd64-installer.exe )
          shopt -u nullglob
          if [ "${#installers[@]}" -eq 1 ]; then
            SRC="${installers[0]}"
            mv "$SRC" "$DST"
            echo "Renamed NSIS installer → $DST (was $SRC)"
          elif [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::No *-amd64-installer.exe found in build/bin — listing:"
            ls -la "build/bin/"
            exit 1
          else
            echo "::error::Multiple *-amd64-installer.exe candidates: ${installers[*]}"
            ls -la "build/bin/"
            exit 1
          fi

      # ── macOS rename + code signing + notarization ──────────────────────
      # Wails names the .app bundle from wails.json `name` (kenaz-harness),
      # ignoring info.productName for the directory name. Rename to
      # "Kenaz Harness.app" so the user-visible artifact matches CFBundleName.
      - name: rename .app bundle to "Kenaz Harness.app" (macos only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "build/bin/kenaz-harness.app" ] && [ ! -d "build/bin/Kenaz Harness.app" ]; then
            mv "build/bin/kenaz-harness.app" "build/bin/Kenaz Harness.app"
          fi
          test -d "build/bin/Kenaz Harness.app" || { echo "::error::expected build/bin/Kenaz Harness.app"; ls -la build/bin; exit 1; }

      # Org-level secret APPLE_CERT_P12 is the base64 of a Developer ID
      # Application .p12 export. Imported into a temp keychain that's
      # destroyed when the runner cleans up; nothing persists.
      # Skips silently when the org secret isn't visible to this repo,
      # so future repos that opt out of signing still build.
      - name: import Apple signing certificate (macos only)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_PRESENT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERT_P12" | base64 -d > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: codesign "Kenaz Harness.app" (macos only)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_PRESENT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        shell: bash
        run: |
          set -euo pipefail
          # --deep covers the embedded Chromium framework + helpers.
          # --options runtime enables Hardened Runtime (required for notarization).
          # --timestamp embeds an Apple-trusted RFC 3161 timestamp.
          codesign --force --deep --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "Developer ID Application: Kameas AI, Inc. (K54JDRHBA7)" \
            "build/bin/Kenaz Harness.app"
          codesign --verify --deep --strict --verbose=2 "build/bin/Kenaz Harness.app"
          codesign -dv --verbose=4 "build/bin/Kenaz Harness.app"

      - name: notarize "Kenaz Harness.app" (macos only)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_PRESENT == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$RUNNER_TEMP/Kenaz-Harness-notarize.zip"
          P8_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8" > "$P8_PATH"
          chmod 600 "$P8_PATH"

          ditto -c -k --sequesterRsrc --keepParent "build/bin/Kenaz Harness.app" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$P8_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m

          xcrun stapler staple "build/bin/Kenaz Harness.app"
          # Final acceptance check — should print "accepted source=Notarized Developer ID"
          spctl -a -vv "build/bin/Kenaz Harness.app"
          rm -f "$P8_PATH"

      - name: install create-dmg (macOS only)
        if: runner.os == 'macOS'
        run: npm install -g create-dmg

      - name: build .dmg installer (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd build/bin
          # create-dmg auto-detects the .app and produces a properly-styled
          # installer with /Applications shortcut + drag prompt.
          # It exits non-zero if the app isn't signed (on unsigned CI runs),
          # so we tolerate that and verify the .dmg was produced regardless.
          create-dmg "Kenaz Harness.app" || true
          # create-dmg names the output "<AppName> <Version>.dmg"; glob and rename.
          DMG_FOUND=$(ls *.dmg 2>/dev/null | head -1)
          if [ -z "$DMG_FOUND" ]; then
            echo "::error::create-dmg produced no .dmg — listing dir:" && ls -la && exit 1
          fi
          mv "$DMG_FOUND" "Kenaz-Harness.dmg"
          echo "DMG produced: Kenaz-Harness.dmg ($(du -h Kenaz-Harness.dmg | cut -f1))"

      - name: codesign + notarize + staple the .dmg (macOS only)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_PRESENT == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DMG="build/bin/Kenaz-Harness.dmg"
          P8_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8" > "$P8_PATH"
          chmod 600 "$P8_PATH"

          codesign --force --sign "Developer ID Application: Kameas AI, Inc. (K54JDRHBA7)" \
            --timestamp --options runtime "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$P8_PATH" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          rm -f "$P8_PATH"

      - name: cleanup keychain (macos, always)
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: macos signing skipped notice
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_PRESENT != 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        shell: bash
        run: |
          echo "::notice::macOS binary not signed — APPLE_CERT_P12 org secret not visible to this repo."
          echo "Add this repo to the kameas-ai org's APPLE_CERT_P12 + APPLE_CERT_P12_PASSWORD +"
          echo "APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID secrets to enable."

      # ── Windows code signing (Microsoft Artifact Signing / Trusted Signing) ──
      # Skips silently when AZURE_CLIENT_ID is not set, so the workflow
      # works pre-enrollment. Once identity validation completes and the
      # five AZURE_* secrets are populated, this step signs every .exe
      # in build/bin via Azure-hosted HSM (no local cert).
      #
      # `continue-on-error: true` on these steps so a federation-credential
      # mismatch (e.g. trust scoped to `main` branch but workflow ran from
      # a tag ref) does NOT abort the build matrix and skip downstream
      # publish jobs. Unsigned binaries are preferable to no binaries.
      # The signing-skipped notice below differentiates "secrets missing"
      # from "login attempted but failed".
      - name: azure login (OIDC) — windows only
        id: azure_login
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID_PRESENT == 'true'
        continue-on-error: true
        uses: azure/login@v2
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: artifact signing (windows .exe)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID_PRESENT == 'true' && steps.azure_login.outcome == 'success'
        continue-on-error: true
        uses: azure/trusted-signing-action@v0.5.1
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: build/bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: signing skipped notice (windows, azure login failed)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID_PRESENT == 'true' && steps.azure_login.outcome != 'success'
        shell: bash
        run: |
          echo "::warning::Windows binary not signed — Azure OIDC login failed."
          echo "Likely cause: federation credential subject doesn't match the workflow's OIDC token."
          echo "If signing is currently scoped to refs/heads/main, add a federation credential for refs/tags/v* (or for the whole repo) in Azure Portal → App Registration → Federated credentials."

      - name: signing skipped notice (windows, secrets missing)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID_PRESENT != 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: bash
        run: |
          echo "::notice::Windows binary not signed — AZURE_CLIENT_ID secret not set."
          echo "Add AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_TRUSTED_SIGNING_ENDPOINT,"
          echo "AZURE_TRUSTED_SIGNING_ACCOUNT, AZURE_TRUSTED_SIGNING_PROFILE to enable."

      - name: archive (linux/macos)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.derive-version.outputs.version }}"
          LABEL="${{ matrix.label }}"
          STAGE="kaneaz-harness-${VERSION}-${LABEL}"
          mkdir -p dist
          # On macOS, pull the .dmg out before renaming build/bin (the auto-update
          # .zip and the human-install .dmg are separate release assets).
          if [ "${{ runner.os }}" = "macOS" ] && [ -f "build/bin/Kenaz-Harness.dmg" ]; then
            cp "build/bin/Kenaz-Harness.dmg" "dist/${STAGE}.dmg"
          fi
          # On linux-amd64, pull the AppImage out before renaming build/bin.
          # The tarball (auto-update payload) and the AppImage (user installer)
          # are separate release assets; arm64 ships tarball-only.
          if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.wails_platform }}" = "linux/amd64" ]; then
            APPIMAGE="build/bin/Kenaz-Harness-${VERSION}-linux-amd64.AppImage"
            if [ -f "$APPIMAGE" ]; then
              cp "$APPIMAGE" "dist/kaneaz-harness-${VERSION}-linux-amd64.AppImage"
              echo "Copied AppImage → dist/kaneaz-harness-${VERSION}-linux-amd64.AppImage"
            else
              echo "::warning::AppImage not found at $APPIMAGE — skipping"
            fi
          fi
          mv build/bin "${STAGE}"
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          else
            zip -r "dist/${STAGE}.zip" "${STAGE}"
          fi
          ls -la dist/

      - name: archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.derive-version.outputs.version }}"
          $label   = "${{ matrix.label }}"
          $stage   = "kaneaz-harness-$version-$label"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # For windows-amd64, copy the NSIS installer to dist/ as a separate
          # release asset before moving build/bin (the .zip auto-update payload
          # and the installer .exe are both published). arm64 ships zip-only.
          if ("${{ matrix.wails_platform }}" -eq "windows/amd64") {
            $installer = "build/bin/Kenaz-Harness-Setup-$version-windows-amd64.exe"
            if (Test-Path $installer) {
              Copy-Item $installer "dist/kaneaz-harness-$version-windows-amd64-setup.exe"
              Write-Output "Copied NSIS installer → dist/kaneaz-harness-$version-windows-amd64-setup.exe"
            } else {
              Write-Warning "NSIS installer not found at $installer — listing build/bin:"
              Get-ChildItem "build/bin"
            }
          }
          # Move-Item (not Rename-Item) — Rename-Item only changes the name
          # in place ("build/$stage"), but Compress-Archive expects the staged
          # folder at cwd. Move-Item relocates it to the working directory.
          Move-Item build/bin $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"
          Get-ChildItem dist

      - name: checksum
        shell: bash
        run: |
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaneaz-harness-${{ matrix.label }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [derive-version, build]
    runs-on: [self-hosted, Linux, ARM64, ci-fast]
    outputs:
      release_tag: ${{ steps.create.outputs.tag }}
      release_url: ${{ steps.create.outputs.url }}
      asset_manifest: ${{ steps.manifest.outputs.json }}
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-flat
          pattern: kaneaz-harness-*
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist-flat/

      - name: upload artifacts to release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.derive-version.outputs.version }}"
          TAG="$VERSION"
          # release-please creates the Release before dispatching us, so
          # `view` should always succeed. If a human runs this via
          # workflow_dispatch against a tag that has no Release yet, fall
          # back to creating one. Notes default to release-please's body
          # when present.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated release for $TAG." \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist-flat/* --clobber
          URL=$(gh release view "$TAG" --json url --jq .url)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: build asset manifest for docs site
        id: manifest
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
          TAG:     ${{ steps.create.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Emit a JSON manifest the docusaurus site consumes.
          # One record per platform with download URL + sha256.
          python3 - <<'PY' > manifest.json
          import json, os, pathlib, re
          tag = os.environ['TAG']
          version = os.environ['VERSION']
          repo = os.environ.get('GITHUB_REPOSITORY', 'kameas-ai/kaneaz-harness')
          base = f"https://github.com/{repo}/releases/download/{tag}"
          dist = pathlib.Path('dist-flat')
          # Build installer URL lookups keyed by platform string.
          # darwin: .dmg  |  windows-amd64: NSIS -setup.exe  |  linux-amd64: .AppImage
          installer_urls: dict = {}
          # Set of filenames that ARE installer assets (skip in main asset loop
          # so they don't also appear as top-level auto-update entries).
          installer_filenames: set = set()
          for f in sorted(dist.iterdir()):
              # macOS .dmg — pattern: kaneaz-harness-<version>-darwin-<arch>.dmg
              dm = re.match(r'kaneaz-harness-.+?-(darwin)-(amd64|arm64)\.dmg$', f.name)
              if dm:
                  os_label, arch = dm.groups()
                  installer_urls[f"{os_label}-{arch}"] = f"{base}/{f.name}"
                  installer_filenames.add(f.name)
                  continue
              # Windows NSIS installer — pattern: kaneaz-harness-<version>-windows-amd64-setup.exe
              wn = re.match(r'kaneaz-harness-.+?-(windows)-(amd64)-setup\.exe$', f.name)
              if wn:
                  os_label, arch = wn.groups()
                  installer_urls[f"{os_label}-{arch}"] = f"{base}/{f.name}"
                  installer_filenames.add(f.name)
                  continue
              # Linux AppImage — pattern: kaneaz-harness-<version>-linux-amd64.AppImage
              ai = re.match(r'kaneaz-harness-.+?-(linux)-(amd64)\.AppImage$', f.name)
              if ai:
                  os_label, arch = ai.groups()
                  installer_urls[f"{os_label}-{arch}"] = f"{base}/{f.name}"
                  installer_filenames.add(f.name)
          assets = []
          for f in sorted(dist.iterdir()):
              if f.suffix in ('.sha256',) or f.name in installer_filenames:
                  continue
              sha_path = dist / f"{f.name}.sha256"
              sha = ''
              if sha_path.exists():
                  sha = sha_path.read_text().split()[0]
              # Parse label from filename: kaneaz-harness-<version>-<label>.<ext>
              m = re.match(r'kaneaz-harness-.+?-(linux|darwin|windows)-(amd64|arm64)\.(.+)$', f.name)
              if not m:
                  continue
              os_label, arch, ext = m.groups()
              entry = {
                  'platform': f"{os_label}-{arch}",
                  'os': os_label,
                  'arch': arch,
                  'filename': f.name,
                  'url': f"{base}/{f.name}",
                  'sha256': sha,
                  'ext': ext,
                  'size_bytes': f.stat().st_size,
              }
              # Wire installer_url for platforms that ship a dedicated installer:
              #   darwin-{amd64,arm64} → .dmg
              #   windows-amd64        → NSIS setup .exe
              #   linux-amd64          → .AppImage
              # windows-arm64 and linux-arm64 have no installer in this release.
              # The `url` field always points at the auto-update payload.
              installer = installer_urls.get(f"{os_label}-{arch}")
              if installer:
                  entry['installer_url'] = installer
              assets.append(entry)
          manifest = {
              'version': version,
              'tag': tag,
              'commit': os.environ.get('GITHUB_SHA', ''),
              'released_at': os.environ.get('GITHUB_RUN_STARTED_AT', ''),
              'release_url': f"https://github.com/{repo}/releases/tag/{tag}",
              'assets': assets,
          }
          print(json.dumps(manifest, indent=2))
          PY
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          cat manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF"        >> "$GITHUB_OUTPUT"
          # Also upload the manifest as a release asset so the docs site
          # can fetch it without needing a token.
          gh release upload "${{ steps.create.outputs.tag }}" manifest.json --clobber

  publish-s3:
    name: Publish artifacts to downloads CDN (S3)
    needs: [derive-version, release]
    runs-on: [self-hosted, Linux, ARM64, ci-medium]
    # The kenaz-harness repo is private and GitHub release assets on
    # private repos require auth — public docs visitors get 404 hitting
    # github.com/.../releases/download/. Mirror to the same S3 bucket
    # downloads.kameas.ai serves from so binaries are reachable at
    # https://downloads.kameas.ai/kenaz-harness/<file>. Same OIDC chain the
    # kenaz-docs deploy uses.
    permissions:
      id-token: write
      contents: read
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-flat
          pattern: kaneaz-harness-*
          merge-multiple: true

      - name: rewrite manifest with docs.kameas.ai URLs
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
          TAG:     ${{ needs.release.outputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          tag = os.environ['TAG']
          version = os.environ['VERSION']
          # Public CDN base — the docs site's CloudFront distribution
          # serves /kenaz-harness/<tag>/<file> from s3://kameas-ai-prod-releases-use2.
          base = f"https://downloads.kameas.ai/kenaz-harness/{tag}"
          dist = pathlib.Path('dist-flat')
          # Build installer URL lookups keyed by platform string.
          # darwin: .dmg  |  windows-amd64: NSIS -setup.exe  |  linux-amd64: .AppImage
          installer_urls: dict = {}
          installer_filenames: set = set()
          for f in sorted(dist.iterdir()):
              # macOS .dmg
              dm = re.match(r'kaneaz-harness-.+?-(darwin)-(amd64|arm64)\.dmg$', f.name)
              if dm:
                  os_label, arch = dm.groups()
                  installer_urls[f"{os_label}-{arch}"] = f"{base}/{f.name}"
                  installer_filenames.add(f.name)
                  continue
              # Windows NSIS installer
              wn = re.match(r'kaneaz-harness-.+?-(windows)-(amd64)-setup\.exe$', f.name)
              if wn:
                  os_label, arch = wn.groups()
                  installer_urls[f"{os_label}-{arch}"] = f"{base}/{f.name}"
                  installer_filenames.add(f.name)
                  continue
              # Linux AppImage
              ai = re.match(r'kaneaz-harness-.+?-(linux)-(amd64)\.AppImage$', f.name)
              if ai:
                  os_label, arch = ai.groups()
                  installer_urls[f"{os_label}-{arch}"] = f"{base}/{f.name}"
                  installer_filenames.add(f.name)
          assets = []
          for f in sorted(dist.iterdir()):
              if f.suffix in ('.sha256',) or f.name in installer_filenames or f.name == 'manifest.json':
                  continue
              sha_path = dist / f"{f.name}.sha256"
              sha = ''
              if sha_path.exists():
                  sha = sha_path.read_text().split()[0]
              m = re.match(r'kaneaz-harness-.+?-(linux|darwin|windows)-(amd64|arm64)\.(.+)$', f.name)
              if not m:
                  continue
              os_label, arch, ext = m.groups()
              entry = {
                  'platform': f"{os_label}-{arch}",
                  'os': os_label,
                  'arch': arch,
                  'filename': f.name,
                  'url': f"{base}/{f.name}",
                  'sha256': sha,
                  'ext': ext,
                  'size_bytes': f.stat().st_size,
              }
              # Wire installer_url for platforms with a dedicated installer (CDN path):
              #   darwin-{amd64,arm64} → .dmg
              #   windows-amd64        → NSIS setup .exe
              #   linux-amd64          → .AppImage
              # windows-arm64 and linux-arm64 have no installer in this release.
              installer = installer_urls.get(f"{os_label}-{arch}")
              if installer:
                  entry['installer_url'] = installer
              assets.append(entry)
          manifest = {
              'version': version,
              'tag': tag,
              'commit': os.environ.get('GITHUB_SHA', ''),
              'released_at': os.environ.get('GITHUB_RUN_STARTED_AT', ''),
              'release_url': f"https://downloads.kameas.ai/",
              'assets': assets,
          }
          pathlib.Path('dist-flat/manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Configure AWS credentials (gh-deploy-prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::764395350337:role/gh-deploy-prod
          aws-region: us-east-2

      - name: Chain-assume AppDeployRole
        shell: bash
        run: |
          set -euo pipefail
          CREDS=$(aws sts assume-role \
            --role-arn arn:aws:iam::777000838085:role/AppDeployRole \
            --role-session-name gh-publish-kenaz-harness \
            --query 'Credentials' --output json)

          echo "::add-mask::$(echo "$CREDS" | jq -r .AccessKeyId)"
          echo "::add-mask::$(echo "$CREDS" | jq -r .SecretAccessKey)"
          echo "::add-mask::$(echo "$CREDS" | jq -r .SessionToken)"
          {
            echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)"
            echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)"
            echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)"
          } >> "$GITHUB_ENV"

      - name: Upload binaries + sha256 to per-tag prefix
        env:
          TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          # Per-tag prefix so old releases stay reachable for users
          # who have a stale /download/ tab open. Long cache (1h) on
          # binaries since filenames are version-stamped.
          aws s3 sync dist-flat/ "s3://kameas-ai-prod-releases-use2/kenaz-harness/${TAG}/" \
            --exclude 'manifest.json' \
            --cache-control 'public, max-age=3600' \
            --metadata-directive REPLACE \
            --no-progress

      - name: Upload manifest at canonical path (short cache)
        env:
          TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          # The download page fetches /kenaz-harness/manifest.json at runtime.
          # Short cache so a fresh release shows up within minutes.
          aws s3 cp dist-flat/manifest.json s3://kameas-ai-prod-releases-use2/kenaz-harness/manifest.json \
            --cache-control 'public, max-age=120, must-revalidate' \
            --content-type 'application/json' \
            --metadata-directive REPLACE \
            --no-progress
          # Also pin a copy under the per-tag prefix for forensic lookup.
          aws s3 cp dist-flat/manifest.json "s3://kameas-ai-prod-releases-use2/kenaz-harness/${TAG}/manifest.json" \
            --cache-control 'public, max-age=3600' \
            --content-type 'application/json' \
            --metadata-directive REPLACE \
            --no-progress

      - name: Update versions index
        env:
          TAG: ${{ needs.release.outputs.release_tag }}
          VERSION: ${{ needs.derive-version.outputs.version }}
          IS_RELEASE: ${{ needs.derive-version.outputs.is_release }}
        run: |
          set -euo pipefail
          # Maintain s3://.../kenaz-harness/index.json — a sorted list of
          # every version that's been published. The download page
          # fetches this lazily when the user opens the version picker.
          # Read-modify-write pattern; a missing index seeds an empty list.
          INDEX_S3=s3://kameas-ai-prod-releases-use2/kenaz-harness/index.json
          if aws s3 cp "$INDEX_S3" /tmp/index.json --no-progress 2>/dev/null; then
            echo "fetched existing index"
          else
            echo '{"updated_at":"","versions":[]}' > /tmp/index.json
            echo "seeded empty index"
          fi
          export NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY' > /tmp/index.new.json
          import json, os, pathlib
          idx = json.loads(pathlib.Path('/tmp/index.json').read_text() or '{}')
          versions = idx.get('versions') or []
          tag = os.environ['TAG']
          # Drop any prior entry for the same tag (rolling 'main' replaces
          # itself; tagged releases shouldn't republish but if they do the
          # latest wins).
          versions = [v for v in versions if v.get('tag') != tag]
          versions.append({
              'tag': tag,
              'version': os.environ['VERSION'],
              'released_at': os.environ['NOW'],
              'is_release': os.environ.get('IS_RELEASE', 'false') == 'true',
              'manifest_url': f"https://downloads.kameas.ai/kenaz-harness/{tag}/manifest.json",
          })
          # Newest first by released_at, with 'main' (rolling) pinned to
          # the top so the picker shows it at the front.
          versions.sort(key=lambda v: (0 if v.get('tag') == 'main' else 1, v.get('released_at', '')), reverse=True)
          # Cap at 50 entries — very old builds drop off the picker but
          # their /kenaz-harness/<tag>/ assets remain in S3 for direct linking.
          versions = versions[:50]
          print(json.dumps({'updated_at': os.environ['NOW'], 'versions': versions}, indent=2))
          PY

          aws s3 cp /tmp/index.new.json "$INDEX_S3" \
            --cache-control 'public, max-age=120, must-revalidate' \
            --content-type 'application/json' \
            --metadata-directive REPLACE \
            --no-progress

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          INV=$(aws cloudfront create-invalidation \
            --distribution-id ENWB9Y4KGTPFD \
            --paths '/kenaz-harness/manifest.json' '/kenaz-harness/index.json' '/kenaz-harness/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation: $INV"
