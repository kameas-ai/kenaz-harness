name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. v0.1.0). Leave empty to derive from sha.'
        required: false
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Match go.mod (currently 1.25.0). Bumping here when go.mod bumps.
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  derive-version:
    name: Derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      is_release: ${{ steps.set.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            IS_RELEASE=true
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            IS_RELEASE=true
          else
            SHORT_SHA=$(git rev-parse --short=8 HEAD)
            DATE=$(date -u +%Y%m%d)
            VERSION="v0.0.0-main-${DATE}-${SHORT_SHA}"
            IS_RELEASE=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (release=${IS_RELEASE})"

  build:
    name: Build ${{ matrix.label }}
    needs: [derive-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
            wails_platform: linux/amd64
            artifact_glob: 'build/bin/*'
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            label: linux-arm64
            wails_platform: linux/arm64
            artifact_glob: 'build/bin/*'
            archive_ext: tar.gz
          - os: macos-13 # Intel runner
            label: darwin-amd64
            wails_platform: darwin/amd64
            artifact_glob: 'build/bin/*.app'
            archive_ext: zip
          - os: macos-14 # Apple Silicon runner
            label: darwin-arm64
            wails_platform: darwin/arm64
            artifact_glob: 'build/bin/*.app'
            archive_ext: zip
          - os: windows-latest
            label: windows-amd64
            wails_platform: windows/amd64
            artifact_glob: 'build/bin/*.exe'
            archive_ext: zip
          # Cross-compile to Windows arm64 from the x86 runner (Wails
          # supports it; no separate runner needed). Trusted Signing's
          # signtool handles arm64 PE files transparently — same step,
          # same secrets, no Windows-arm64 runner required.
          - os: windows-latest
            label: windows-arm64
            wails_platform: windows/arm64
            artifact_glob: 'build/bin/*.exe'
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write   # required for Azure OIDC federation on Windows signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: install wails system deps (linux)
        if: runner.os == 'Linux'
        run: |
          # ubuntu-latest moved to 24.04, which ships libwebkit2gtk-4.1
          # (not 4.0). Pair with the `webkit2_41` build tag below.
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: install wails CLI
        # Pin to the same version we've validated locally; @latest can ship
        # breaking generator changes (the Wails CLI emits TS bindings, etc.).
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: frontend deps
        working-directory: frontend
        run: npm ci

      - name: wails build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.derive-version.outputs.version }}"
          # The -tags flag is only valid with an argument. Linux needs
          # webkit2_41 (gtk 4.1); macOS + Windows want no tags. Build the
          # arg list conditionally so we don't emit a bare `-tags` on
          # platforms that don't need one.
          ARGS=(
            -platform "${{ matrix.wails_platform }}"
            -ldflags "-X main.Version=${VERSION}"
            -trimpath
          )
          if [ "${{ runner.os }}" = "Linux" ]; then
            ARGS+=(-tags webkit2_41)
          fi
          wails build "${ARGS[@]}"

      # ── macOS rename + code signing + notarization ──────────────────────
      # Wails names the .app bundle from wails.json `name` (kenaz-harness),
      # ignoring info.productName for the directory name. Rename to "Kenaz.app"
      # so the user-visible artifact matches CFBundleName.
      - name: rename .app bundle to Kenaz.app (macos only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "build/bin/kenaz-harness.app" ] && [ ! -d "build/bin/Kenaz.app" ]; then
            mv "build/bin/kenaz-harness.app" "build/bin/Kenaz.app"
          fi
          test -d "build/bin/Kenaz.app" || { echo "::error::expected build/bin/Kenaz.app"; ls -la build/bin; exit 1; }

      # Org-level secret APPLE_CERT_P12 is the base64 of a Developer ID
      # Application .p12 export. Imported into a temp keychain that's
      # destroyed when the runner cleans up; nothing persists.
      # Skips silently when the org secret isn't visible to this repo,
      # so future repos that opt out of signing still build.
      - name: import Apple signing certificate (macos only)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERT_P12" | base64 -d > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: codesign Kenaz.app (macos only)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        shell: bash
        run: |
          set -euo pipefail
          # --deep covers the embedded Chromium framework + helpers.
          # --options runtime enables Hardened Runtime (required for notarization).
          # --timestamp embeds an Apple-trusted RFC 3161 timestamp.
          codesign --force --deep --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "Developer ID Application: Kameas AI, Inc. (K54JDRHBA7)" \
            build/bin/Kenaz.app
          codesign --verify --deep --strict --verbose=2 build/bin/Kenaz.app
          codesign -dv --verbose=4 build/bin/Kenaz.app

      - name: notarize Kenaz.app (macos only)
        if: runner.os == 'macOS' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$RUNNER_TEMP/Kenaz-notarize.zip"
          P8_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8" > "$P8_PATH"
          chmod 600 "$P8_PATH"

          ditto -c -k --sequesterRsrc --keepParent build/bin/Kenaz.app "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$P8_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m

          xcrun stapler staple build/bin/Kenaz.app
          # Final acceptance check — should print "accepted source=Notarized Developer ID"
          spctl -a -vv build/bin/Kenaz.app
          rm -f "$P8_PATH"

      - name: cleanup keychain (macos, always)
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: macos signing skipped notice
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 == ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        shell: bash
        run: |
          echo "::notice::macOS binary not signed — APPLE_CERT_P12 org secret not visible to this repo."
          echo "Add this repo to the kameas-ai org's APPLE_CERT_P12 + APPLE_CERT_P12_PASSWORD +"
          echo "APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID secrets to enable."

      # ── Windows code signing (Microsoft Artifact Signing / Trusted Signing) ──
      # Skips silently when AZURE_CLIENT_ID is not set, so the workflow
      # works pre-enrollment. Once identity validation completes and the
      # five AZURE_* secrets are populated, this step signs every .exe
      # in build/bin via Azure-hosted HSM (no local cert).
      - name: azure login (OIDC) — windows only
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: artifact signing (windows .exe)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: build/bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: signing skipped notice (windows, secrets missing)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID == ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: bash
        run: |
          echo "::notice::Windows binary not signed — AZURE_CLIENT_ID secret not set."
          echo "Add AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_TRUSTED_SIGNING_ENDPOINT,"
          echo "AZURE_TRUSTED_SIGNING_ACCOUNT, AZURE_TRUSTED_SIGNING_PROFILE to enable."

      - name: archive (linux/macos)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.derive-version.outputs.version }}"
          LABEL="${{ matrix.label }}"
          STAGE="kaneaz-harness-${VERSION}-${LABEL}"
          mkdir -p dist
          mv build/bin "${STAGE}"
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          else
            zip -r "dist/${STAGE}.zip" "${STAGE}"
          fi
          ls -la dist/

      - name: archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.derive-version.outputs.version }}"
          $label   = "${{ matrix.label }}"
          $stage   = "kaneaz-harness-$version-$label"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Rename-Item build/bin $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"
          Get-ChildItem dist

      - name: checksum
        shell: bash
        run: |
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaneaz-harness-${{ matrix.label }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [derive-version, build]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.create.outputs.tag }}
      release_url: ${{ steps.create.outputs.url }}
      asset_manifest: ${{ steps.manifest.outputs.json }}
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-flat
          pattern: kaneaz-harness-*
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist-flat/

      - name: create or update release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ needs.derive-version.outputs.version }}"
          IS_RELEASE="${{ needs.derive-version.outputs.is_release }}"

          if [ "$IS_RELEASE" = "true" ]; then
            # Tagged release: upload to existing release if possible, otherwise create.
            TAG="$VERSION"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --title "$TAG" \
                --notes "Automated release from main." \
                --target "$GITHUB_SHA"
            fi
            gh release upload "$TAG" dist-flat/* --clobber
            URL=$(gh release view "$TAG" --json url --jq .url)
          else
            # Pre-release rolling channel: replace the "main" prerelease.
            TAG="main"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --yes --cleanup-tag
            fi
            gh release create "$TAG" \
              --title "main (rolling, $VERSION)" \
              --notes "Rolling build from main. Not a stable release." \
              --prerelease \
              --target "$GITHUB_SHA" \
              dist-flat/*
            URL=$(gh release view "$TAG" --json url --jq .url)
          fi

          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "url=$URL"   >> "$GITHUB_OUTPUT"

      - name: build asset manifest for docs site
        id: manifest
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
          TAG:     ${{ steps.create.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Emit a JSON manifest the docusaurus site consumes.
          # One record per platform with download URL + sha256.
          python3 - <<'PY' > manifest.json
          import json, os, pathlib, re
          tag = os.environ['TAG']
          version = os.environ['VERSION']
          repo = os.environ.get('GITHUB_REPOSITORY', 'kameas-ai/kaneaz-harness')
          base = f"https://github.com/{repo}/releases/download/{tag}"
          dist = pathlib.Path('dist-flat')
          assets = []
          for f in sorted(dist.iterdir()):
              if f.suffix == '.sha256':
                  continue
              sha_path = dist / f"{f.name}.sha256"
              sha = ''
              if sha_path.exists():
                  sha = sha_path.read_text().split()[0]
              # Parse label from filename: kaneaz-harness-<version>-<label>.<ext>
              m = re.match(r'kaneaz-harness-.+?-(linux|darwin|windows)-(amd64|arm64)\.(.+)$', f.name)
              if not m:
                  continue
              os_label, arch, ext = m.groups()
              assets.append({
                  'platform': f"{os_label}-{arch}",
                  'os': os_label,
                  'arch': arch,
                  'filename': f.name,
                  'url': f"{base}/{f.name}",
                  'sha256': sha,
                  'ext': ext,
                  'size_bytes': f.stat().st_size,
              })
          manifest = {
              'version': version,
              'tag': tag,
              'commit': os.environ.get('GITHUB_SHA', ''),
              'released_at': os.environ.get('GITHUB_RUN_STARTED_AT', ''),
              'release_url': f"https://github.com/{repo}/releases/tag/{tag}",
              'assets': assets,
          }
          print(json.dumps(manifest, indent=2))
          PY
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          cat manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF"        >> "$GITHUB_OUTPUT"
          # Also upload the manifest as a release asset so the docs site
          # can fetch it without needing a token.
          gh release upload "${{ steps.create.outputs.tag }}" manifest.json --clobber

  notify-docs:
    name: Notify docusaurus site
    needs: [derive-version, release]
    runs-on: ubuntu-latest
    # Only fire for tagged releases or main rolling builds.
    if: needs.derive-version.outputs.is_release == 'true' || github.event_name == 'push'
    steps:
      - name: dispatch update to kenaz-docs
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DOCS_TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN not set — skipping docs dispatch."
            echo "To enable: add a PAT with 'repo' scope on kameas-ai/kenaz-docs as DOCS_DISPATCH_TOKEN secret on this repo."
            exit 0
          fi

          # repository_dispatch into kenaz-docs; that repo's workflow
          # consumes type "kaneaz-harness-release" + the manifest payload
          # to update its download page.
          curl -fsSL -X POST \
            -H "Authorization: token ${DOCS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kameas-ai/kenaz-docs/dispatches \
            -d @- <<EOF
          {
            "event_type": "kaneaz-harness-release",
            "client_payload": {
              "version": "${{ needs.derive-version.outputs.version }}",
              "tag":     "${{ needs.release.outputs.release_tag }}",
              "release_url": "${{ needs.release.outputs.release_url }}",
              "manifest_url": "https://github.com/kameas-ai/kaneaz-harness/releases/download/${{ needs.release.outputs.release_tag }}/manifest.json",
              "is_release": ${{ needs.derive-version.outputs.is_release }}
            }
          }
          EOF
