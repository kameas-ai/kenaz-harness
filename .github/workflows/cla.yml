# Kameas CLA check
#
# Posts a CLA-signing prompt on the first PR from any non-allowlisted
# contributor and blocks merge until they sign. Signatures are stored in
# the org-wide kameas-ai/cla-signatures repository so a contributor signs
# once for all Kameas open-source projects.
#
# This workflow was adopted from the org template at
# kameas-ai/.github → workflow-templates/cla.yml. To roll a template update
# across repos, open a PR against each adopting repo with the updated file.
#
# Required secrets:
#   PERSONAL_ACCESS_TOKEN — a fine-grained Personal Access Token scoped to
#     the kameas-ai/cla-signatures repository with Contents: read+write.
#     The bot uses this to append signatures to signatures/v1/cla.json
#     in that repo. The token MUST NOT have write access to any other repo.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA check
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://kameas.ai/cla.html'
          branch: 'main'
          allowlist: 'dependabot[bot],renovate[bot],github-actions[bot],alecfeeman'
          remote-organization-name: 'kameas-ai'
          remote-repository-name: 'cla-signatures'
          custom-notsigned-prflag: 'cla-not-signed'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All CLA requirements met.'
          create-file-commit-message: 'chore(cla): record signature'
          signed-commit-message: 'chore(cla): $contributorName has signed the CLA in $owner/$repo#$pullRequestNo'
          lock-pullrequest-aftermerge: true
