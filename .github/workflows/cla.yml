# Kameas CLA check
#
# Posts a CLA-signing prompt on the first PR from any non-allowlisted
# contributor and blocks merge until they sign. Signatures are stored in
# the org-wide kameas-ai/cla-signatures repository so a contributor signs
# once for all Kameas open-source projects.
#
# This workflow was adopted from the org template at
# kameas-ai/.github → workflow-templates/cla.yml. To roll a template update
# across repos, open a PR against each adopting repo with the updated file.
#
# Authentication: minted at runtime from the `kameas-ai-oss-bot` GitHub
# App via actions/create-github-app-token@v1. The App must be installed
# on this repo AND on kameas-ai/cla-signatures with Contents: R+W,
# Pull requests: R+W, Issues: R+W. Tokens last 1 hour and auto-expire.
#
# Required repo secrets:
#   KAMEAS_OSS_BOT_APP_ID          — numeric App ID (visible at the App's
#                                    org-settings page).
#   KAMEAS_OSS_BOT_APP_PRIVATE_KEY — the .pem private key for the App.
#
# Both mirror to AWS Secrets Manager under
#   kameas-ai/oss-bot/github-app-{id,private-key} (us-east-2).

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Mint installation token from kameas-ai-oss-bot App
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KAMEAS_OSS_BOT_APP_ID }}
          private-key: ${{ secrets.KAMEAS_OSS_BOT_APP_PRIVATE_KEY }}
          owner: kameas-ai
          # Both repos the CLA workflow needs access to: the current repo
          # (to comment + label PRs) and the shared signatures store
          # (to append signatures). The workflow context's repo name is
          # injected at runtime; cla-signatures is hard-coded since it's
          # the single shared store for the whole org.
          repositories: |
            ${{ github.event.repository.name }}
            cla-signatures

      - name: CLA check
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # GITHUB_TOKEN is the App-minted token for the current repo;
          # PERSONAL_ACCESS_TOKEN is the App-minted token for the
          # signatures repo. The contributor-assistant action splits its
          # API calls between the two by env-var name (legacy naming —
          # it's not actually a PAT in our case).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://kameas.ai/cla.html'
          branch: 'main'
          allowlist: 'dependabot[bot],renovate[bot],github-actions[bot],claude,alecfeeman'
          remote-organization-name: 'kameas-ai'
          remote-repository-name: 'cla-signatures'
          custom-notsigned-prflag: 'cla-not-signed'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All CLA requirements met.'
          create-file-commit-message: 'chore(cla): record signature'
          signed-commit-message: 'chore(cla): $contributorName has signed the CLA in $owner/$repo#$pullRequestNo'
          lock-pullrequest-aftermerge: true
