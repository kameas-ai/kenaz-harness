name: PR Title
# kameas-ci: check

# Enforces conventional-commits on PR titles. The branch ruleset on
# `main` squashes PRs and uses the PR title verbatim as the merge-commit
# subject (squash_merge_commit_title=PR_TITLE), so this check is the
# single point of truth release-please reads when computing the next
# version. A non-conventional title would land an un-versioned commit on
# main and silently skip the release.

# Manual only (owner decision 2026-10-30). Dispatch on the PR's branch; the
# check looks up the open PR for that branch and validates its title. The job
# name `Conventional Commits` is a REQUIRED status check — do not rename it.
# (amannn/action-semantic-pull-request only works on pull_request events, so
# the check is inline. python3 + the REST API, not gh: the ci-fast runner
# image lacks the gh CLI.)
on:
  workflow_dispatch:

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ${{ fromJson(vars.CI_RUNNER_FAST || '["self-hosted","Linux","ARM64","ci-fast"]') }}
    steps:
      - name: PR title is a Conventional Commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Open PR whose head is this branch ('' when there is none).
          title="$(python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          owner = repo.split("/")[0]
          q = urllib.parse.urlencode({"head": f"{owner}:{os.environ['GITHUB_REF_NAME']}", "state": "open"})
          req = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{repo}/pulls?{q}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          prs = json.load(urllib.request.urlopen(req))
          print(prs[0]["title"] if prs else "")
          PY
          )"
          [ -n "$title" ] || { echo "::error::no open PR for $GITHUB_REF_NAME"; exit 1; }
          echo "PR title: $title"
          # Keep this type list aligned with release-please-config.json
          # changelog-sections so unknown types can never sneak in. Scope is
          # optional but if supplied must be lowercase tokens (e.g.
          # feat(llm): ...). Subject must be non-empty and not start with
          # whitespace/a period or end with a period/space. Uppercase-first
          # subjects are allowed (spec-kitty "feat(scope): WP## — ..." titles).
          re='^(feat|fix|perf|revert|deps|docs|style|chore|refactor|test|build|ci)(\([a-z0-9][a-z0-9._/,-]*\))?!?: [^[:space:].](.*[^. ])?$'
          [[ "$title" =~ $re ]] || { echo "::error::PR title is not a Conventional Commit: $title"; exit 1; }
          echo "OK"
