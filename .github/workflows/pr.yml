name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # test-frontend's `npm ci` installs @kameas-ai/kenaz-design-system from
  # GitHub Packages — an explicit `permissions:` block zeroes out every
  # unlisted scope (including packages), so this has to be listed
  # explicitly or GITHUB_TOKEN can't authenticate against npm.pkg.github.com.
  packages: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  lint-go:
    name: Go lint + vet + codegen drift
    runs-on: [self-hosted, Linux, ARM64, ci-medium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # check-upgrade-snapshots-locked.sh runs `git merge-base HEAD
          # origin/main`. A shallow checkout cannot answer that: at depth
          # 1 the two histories share no commit and the gate fails with
          # "found no common ancestor" — which is exactly what happened
          # on PR #294, the first time this gate ever ran in CI. Fetching
          # origin/main at depth 1 (the previous attempt, below) resolves
          # the REF but not the ancestry, so it did not help. merge-base
          # needs real history.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: false on self-hosted ARM64 runners — they persist
          # /home/go/pkg/mod/ across jobs, so the action's tar-restore
          # collides with existing files ("Cannot open: File exists").
          # Modules carry over naturally; no caching needed.
          cache: false

      - name: fetch tags (both upgrade-snapshot gates compare against release tags)
        # fetch-depth: 0 above brings full history but not tags.
        # check-upgrade-snapshots-locked.sh bounds "locked" by release tag;
        # check-upgrade-snapshot-present.sh FAILS outright with no tags,
        # rather than passing vacuously, so this step is load-bearing.
        run: git fetch --tags origin

      - name: go mod download
        run: go mod download

      - name: ensure frontend/dist exists for embed
        # main.go uses //go:embed all:frontend/dist. Without this stub
        # the typecheck pass inside golangci-lint fails on a clean
        # checkout because no frontend build has run yet.
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: go vet
        # Scoped to ./core/... ./cmd/... . rather than ./core/... alone —
        # entry-points-and-crash-reporting-01PMZD13 UNIT-1. Three of the
        # four cmd/ packages (kenaz-updater, mcpsubcmd, harness-served) and
        # the module root were vetted by nothing; only cmd/harness-vm was
        # covered, via the test-go job's ./cmd/harness-vm/... pattern below.
        run: go vet ./core/... ./cmd/... .

      - name: golangci-lint
        # v8 supports golangci-lint v2.x, which is built with go1.25 and can
        # load configs targeting Go 1.25.0 (go.mod's `go` directive).
        # only-new-issues: true scopes failures to PR-introduced issues so
        # the lint gate does not fail on the existing debt the codebase
        # accumulated while lint was misconfigured. Burn down the
        # backlog opportunistically; do not block PRs on it.
        #
        # continue-on-error: true matches the documented intent (don't
        # block on lint) and ALSO works around golangci-lint-action's
        # 300-file diff API limit which fails any PR with > 300 changed
        # files (e.g. our v0.2.0 release PR which bundles 83 commits).
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        continue-on-error: true
        with:
          version: v2.5.0
          args: --timeout=5m
          working-directory: .
          only-new-issues: true

      - name: ensure cmd/harness-served embed target exists
        # cmd/harness-served/main.go uses //go:embed all:frontend/dist-served,
        # resolved PACKAGE-relative (unlike the root's frontend/dist, which is
        # module-relative) — see the file's own build comment. Nothing in
        # pr.yml or release.yml ever built the serve tag before this
        # (entry-points-and-crash-reporting-01PMZD13 UNIT-1), so it has never
        # been proven to compile in CI. A .gitkeep-only directory satisfies
        # the `all:` embed pattern (confirmed by running it, not assumed).
        run: |
          mkdir -p cmd/harness-served/frontend/dist-served
          touch cmd/harness-served/frontend/dist-served/.gitkeep

      - name: go build (serve tag)
        # Proves cmd/harness-served, core/rpc/wf_adapters_notifier_serve.go,
        # core/rpc/bindings_wails_serve.go, core/rpc/emitter_serve.go,
        # core/rpc/views/shell/impl_new_serve.go and core/rpc/csp_serve.go
        # all still compile. Before this step existed, `-tags serve` appeared
        # in no workflow and this whole build tag was silently uncompiled.
        run: go build -tags serve ./...

      - name: entrypoint-coverage guard
        # entry-points-and-crash-reporting-01PMZD13 UNIT-1. Every main
        # package under cmd/, plus the module root, must be covered by a
        # pr.yml Go vet/test pattern above — the recurrence prevention for
        # this mission: cmd/kenaz-updater and cmd/mcpsubcmd had 573 lines of
        # passing tests CI never ran, and this build-serve step above had no
        # workflow line at all until this unit.
        run: bash scripts/ci/check-entrypoint-coverage.sh

      - name: codegen idempotent
        run: bash scripts/ci/check-codegen.sh

      - name: node-dispatch guard
        # Manifest dispatch: <-> newExecutorRegistry(), both directions.
        # wiring-integrity-01PMAG04 WP04. Ships green against main: every
        # kind manifest under core/agentgraph/nodes/manifests/ already
        # declares dispatch: graph|builtin_tool (WP01).
        run: bash scripts/ci/check-node-dispatch.sh

      - name: output-ports guard
        # Every agentgraph node Outputs["k"] write is read (Go, a shipped/
        # tested YAML graph, or the frontend) or carries a
        # //wiring:deferred directive. wiring-integrity-01PMAG04 WP05 —
        # see docs/wiring-audit.md's "Re-run methodology" section before
        # touching this script; a naive Go-only version over-reports 3x.
        run: bash scripts/ci/check-output-ports.sh

      - name: seam-implementers guard
        # Every interface in core/agentgraph/seams.go has >=1 non-test
        # implementer or a //wiring:deferred directive. Uses the Go type
        # checker (golang.org/x/tools/go/packages), not grep — interface
        # satisfaction is structural and grep cannot answer it soundly.
        # wiring-integrity-01PMAG04 WP06.
        run: bash scripts/ci/check-seam-implementers.sh

      - name: knob-coverage guard
        # Generalises the resolved-config coverage check any dial system
        # can opt into: go test ./core/... -run 'TestKnobCoverage' picks
        # up every TestKnobCoverage* test module-wide, so a new mission
        # gets enforcement by registering + writing one test, with no
        # further change to this step. wiring-integrity-01PMAG04 WP07 —
        # see core/wiring/knobcoverage's package doc for the contract.
        run: bash scripts/ci/check-knob-coverage.sh

      - name: bindings-name guard
        run: bash scripts/ci/check-binding-names.sh

      - name: listpending-coverage guard
        # consent-surfaces-truth-01PMTR01 WP03. Every `<Family>_ListPending`
        # binding must have a reader in harnessClient.ts. Permissions_ListPending
        # existed end to end on the Go side with zero frontend callers, so a
        # permission prompt lost across a reload never came back — the turn hung
        # until the registry's 5-minute timeout fail-closed denied it.
        run: bash scripts/ci/check-listpending-coverage.sh

      - name: emitter-isolation guard
        run: bash scripts/ci/check-emitter-isolation.sh

      - name: wailsjs-isolation guard
        run: bash scripts/ci/check-wailsjs-isolation.sh

      - name: single-persistence-file guard
        run: bash scripts/ci/check-single-persistence-file.sh

      - name: test-only-symbols guard
        run: bash scripts/ci/check-test-only-symbols.sh

      - name: no-credential-in-ui guard
        run: bash scripts/ci/check-no-credential-in-ui.sh

      - name: no-user-content-in-slog guard
        run: bash scripts/ci/check-no-user-content-in-slog.sh

      - name: cedar gate-argument guard (I13)
        # Added by v0.63.1 to stop the six Cedar gate sites being re-pinned
        # to AllowAll{} or a nil engine — the defect that let a user author
        # a policy the editor validated, saved and listed as loaded while
        # nothing enforced it. The gate shipped; no workflow ever invoked
        # it, so the regression it exists to prevent was uncaught.
        run: bash scripts/ci/check-cedar-gate-arguments.sh

      - name: cedar engine singleton guard (I15)
        # Added by WP05 of consent-surfaces-truth-01PMTR01 (the hoist to
        # one shared *cedar.Engine per process). I13 checks the ARGUMENT
        # at a call site; it has no vocabulary for "N separate engines
        # exist where the product promises one" — which is why thirteen
        # independent buildCedarGate/buildCedarEngineOrNil constructions
        # passed it clean pre-hoist. Fails if a future change re-pins any
        # gate site back to its own construction call, silently breaking
        # SavePolicy + ReloadPolicies' reach to that gate.
        run: bash scripts/ci/check-cedar-engine-singleton.sh

      - name: no-cred-bytes-in-rpc guard
        # Credential hygiene. CLAUDE.md lists this under "Local dev
        # commands" as though it were enforced; it was running only when a
        # developer remembered to.
        run: bash scripts/ci/check-no-cred-bytes-in-rpc.sh

      - name: tool containment unconditional guard (AC-015)
        # harness-self-attach-01PMHS01 UNIT-4: the merged permission
        # resolver (static arm + Cedar session-kind arm) is the ONLY
        # boundary for model-initiated unattended tool execution (owner
        # rulings B-2/B-3). Before UNIT-4, `perms` was built only inside
        # an `if c != nil && c.DataDir() != ""` block, so an empty
        # DataDir or a static-config load error left it nil — and nil is
        # indistinguishable from "no resolver" to every consumer. A naive
        # existence grep for the call would pass even if a future edit
        # re-wrapped it in that same conditional; this gate checks the
        # call is a top-level (unconditional) statement instead.
        run: bash scripts/ci/check-tool-containment-unconditional.sh

      - name: manifest version-bump guard
        run: bash scripts/ci/check-manifest-version-bump.sh

      - name: fleet log-export fence guard
        # The harness must not ship its raw slog stream to Fleet. Verifies the
        # compiled kind ceiling + its anti-drift gate exist, the wire-level
        # regression tests still exist, and no OTLP *log* exporter is
        # constructed without an explicit opt-out annotation.
        run: bash scripts/ci/check-fleet-log-export-fence.sh

      - name: fleet kind-schema parity (cross-repo)
        # Compares the vendored core/fleet/schema/kinds.json against
        # kenaz-fleet's schema v1 when a checkout is available. Skips
        # (does not fail) when kenaz-fleet is not checked out — the private
        # sibling repo is not cloned in harness CI today, so this runs green
        # locally for engineers and in the workspace cross-repo job.
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -run 'TestVendoredKindSchema' ./core/fleet/

      - name: no-fleet-imports guard
        # Enforces OSS-first contract: only core/rpc/views/settings/ is
        # permitted to import core/fleet/. Passes when core/fleet/ is
        # absent (fork case). — fleet-auth-foundation-01NDFSEX08 WP07
        run: bash scripts/ci/check-no-fleet-imports.sh

      - name: no-model-family-literals guard
        # Bans hardcoded model-family name literals (claude, gemini,
        # haiku, opus, sonnet, gpt-, o1, mini, nano, ultra) in core logic
        # outside core/llm/** — closes the tierFromModelID frozen-core
        # violation this WP fixed in core/agentgraph. A same-line
        # `// model-lit-allow: <reason>` comment opts out a genuine
        # non-classification reference. — versioned-model-profile-01PMDL04 WP04
        run: bash scripts/ci/check-no-model-family-literals.sh

      - name: oss-first guard
        # Verifies non-fleet packages + frontend tests pass with
        # HARNESS_FLEET_DISABLED=1. — fleet-auth-foundation-01NDFSEX08 WP07
        # Frontend step is skipped in worktrees where node_modules are absent
        # (it runs fully in test-frontend which does npm ci first).
        run: bash scripts/ci/check-oss-first.sh

      - name: serve-dispatch drift gate (I15)
        # FR-005 / I15, promoted served-mode-is-a-real-mode-01PMZ707 WP02
        # (escalation-register E-2): fails when a desktop Bindings method has
        # no serve-mode dispatch case AND no dated line in
        # scripts/ci/allowlists/i15-serve-dispatch-{gap,reverse}.txt, in
        # either direction (bindings-without-a-case, or a dispatch case with
        # no matching binding). Gates by default now — SERVE_DRIFT_GATE=0
        # reverts to informational-only.
        run: bash scripts/ci/check-serve-dispatch-drift.sh

      - name: serve-gap classification coverage (WP07, AC-717)
        # served-mode-is-a-real-mode-01PMZ707 WP07: every entry in
        # scripts/ci/allowlists/i15-serve-dispatch-gap.txt must sit under one
        # of spec.md §5.7's five classes (gated / boundary-panelled /
        # unrouted / desktop-only-by-nature / untriaged), and every
        # untriaged entry must be dated and name an owner. The drift gate
        # above only checks that an entry EXISTS in the allowlist — it has
        # never known or cared about classification, so this closes the gap
        # AC-717 names: a taxonomy nothing enforces is the same failure as
        # the gate that used to always exit 0.
        run: bash scripts/ci/check-serve-gap-classification.sh

      - name: agentgraph-convergence guard (I3/I6/I7)
        # kitty-specs/agentgraph-total-convergence-01PMGX01 WP01. Every
        # callable node kind must be exercised end-to-end by a shipped
        # graph/activity (I3), no kind may be reachable ONLY through the
        # dead-in-production toolloop_default.yaml template (I6), and every
        # non-test package under core/ must have a non-test importer or be
        # an entry point (I7). Fails on an unlisted violation OR a stale
        # allow-list entry — scripts/ci/allowlists/i3-unexercised-kinds.txt,
        # i6-template-only-kinds.txt, i7-orphan-packages.txt shrink as
        # follow-up WPs converge each one.
        run: bash scripts/ci/check-agentgraph-convergence.sh

      - name: no-unwired-gates guard (I10)
        # kitty-specs/agentgraph-total-convergence-01PMGX01 WP01. Catches
        # the `EvaluateToolGate`-class defect: an exported gate/enforce/
        # authorize function with zero non-test call sites — code that
        # reads as load-bearing but never runs in production.
        # scripts/ci/allowlists/i10-unwired-gates.txt documents today's
        # instances.
        run: bash scripts/ci/check-no-unwired-gates.sh

      - name: builtin-tool-registration guard (I11)
        # Unwired sweep 2026-08-14 (model-moves-transcript-01PMCH01 WP00).
        # Catches the `kenaz__monitor`-class defect: a complete, tested
        # builtin tool that no wiring site ever imports, so no model can
        # call it. Invisible to the registered-tools tripwire, which only
        # iterates the tools that DID register.
        # scripts/ci/allowlists/i11-unregistered-builtin-tools.txt
        # documents today's single instance.
        run: bash scripts/ci/check-builtin-tool-registration.sh

      - name: hook-event-fire-sites guard (I17, G-2)
        # trust-surfaces-that-fire-01PMZ202 WP08 (UNIT-7). Catches the
        # event-picker-that-lies defect: before this WP, the hook editor
        # offered 18 events; UNIT-1 established empirically that at most
        # one (pre_send) actually reaches a production Fire/FireAsync/
        # Run<X> call. Three legs: (a) every FIRING_HOOK_EVENTS entry has
        # a real, non-test fire site; (b) FIRING_HOOK_EVENTS ⊆
        # ALL_HOOK_EVENTS ⊆ core/hooks.AllEvents; (c) every AllEvents
        # entry not in FIRING_HOOK_EVENTS has a dated, owner-named row in
        # scripts/ci/allowlists/i17-eventless-hook-events.txt. Leg (c) is
        # what makes the allowlist shrink monotonically as WP09-WP21 land
        # their producers.
        run: bash scripts/ci/check-hook-event-fire-sites.sh

      - name: onboarding-starter-tools guard (FR-007)
        # first-run-onboarding-01PMOB01 WP04. Catches the code.md:23-class
        # defect: a shipped onboarding starter prompt naming a harness_*
        # tool register.go does not register (e.g. deleted by a later
        # sweep). No allowlist — a starter prompt either names a real tool
        # or it doesn't ship. Covers only the SHIPPED starters under
        # core/mcp/builtin/harness/onboarding/*.md; user-authored
        # <DataDir>/onboarding/prompts/*.md overrides are out of CI's reach
        # by design (C-007).
        run: bash scripts/ci/check-onboarding-starter-tools.sh

      - name: broker-topic-consumers guard (I14)
        # kitty-specs/self-update-repair-01PMUP01 WP06, spec §6. Catches
        # the A8-class defect: a broker topic const published into a live
        # broker with no subscriber in any language — a real emit into a
        # real void. The mission shipped the script but never added this
        # step, so the gate could not fail a PR; added in review.
        # scripts/ci/allowlists/i14-unconsumed-broker-topics.txt
        # documents today's single instance (mcp:progress).
        run: bash scripts/ci/check-broker-topic-consumers.sh

      - name: single-move-writer guard
        # kitty-specs/model-moves-transcript-01PMCH01 WP01, spec §4:
        # "One writer: session_write/the chat runner persists moves
        # through the same seam — no second history-writing path."
        # session.Message's move fields are unexported so the compiler
        # holds the cross-package half; this covers the three holes it
        # cannot see — a second assigner inside core/session, someone
        # exporting the fields, and the seam having zero or >1
        # production callers.
        run: bash scripts/ci/check-single-move-writer.sh

      - name: no-forbidden-compaction-symbols guard (I4)
        # kitty-specs/agentgraph-total-convergence-01PMGX01 WP01. Exactly
        # one compaction entry point: `SuppressAutomaticCompaction` and
        # `runPreSendCompaction` are grep-forbidden outside
        # scripts/ci/allowlists/i4-forbidden-compaction-symbols.txt, which
        # allow-lists both today (spec §4.4/WP08 retires them).
        run: bash scripts/ci/check-no-forbidden-compaction-symbols.sh

      - name: upgrade-snapshots-locked guard
        # upgrade-path-coverage-01PMUG01 WP02, spec §4/§6.2. Snapshot
        # directories under core/storage/sqlite/testdata/upgrade/ for an
        # already-released tag are immutable — a "fix" that edits one
        # invalidates it as ground truth for the upgrade-path job.
        run: bash scripts/ci/check-upgrade-snapshots-locked.sh

      - name: graph-write-paths guard
        # model-authored-graphs-01PMGA01 UNIT-8. UNIT-2 stopped the manager
        # persisting graphs the validator rejects; UNIT-4 made graph writes
        # ask Cedar. Both live inside Manager.saveGraph and neither survives
        # a second writer — an os.WriteFile against the library bypasses the
        # validator AND the consent gate while every existing test keeps
        # passing, because they all drive saveGraph. Planted-violation proof:
        # scripts/ci/gates_can_fail_test.go
        # "graph-write-paths/second-writer-bypasses-validation".
        run: bash scripts/ci/check-graph-write-paths.sh

      - name: upgrade-snapshot-present guard
        # The ABSENCE half of the snapshot contract. The lock gate above
        # catches MODIFICATION of a committed snapshot and structurally
        # cannot see a MISSING one, so nothing failed when a release
        # shipped without adding its snapshot — which happened on three
        # consecutive releases (v0.63.2, v0.64.0, v0.64.1). The
        # upgrade-path job keeps passing in that state; it just silently
        # stops covering anything newer. Planted-violation proof:
        # scripts/ci/gates_can_fail_test.go
        # "upgrade-snapshot-present/chain-behind-newest-tag".
        run: bash scripts/ci/check-upgrade-snapshot-present.sh

      - name: destructive-migration-coverage guard (I14)
        # upgrade-path-coverage-01PMUG01 WP03, spec §FR-2. A migration
        # is dormant until an upgrade path reaches it; repairing
        # selection is what aims dormant migrations at real rows for
        # the first time. Every migration whose Up() runs DROP TABLE /
        # DROP INDEX / DROP TRIGGER / DROP COLUMN / ALTER TABLE RENAME
        # / a non-scratch DELETE FROM must have a populated-table test
        # or a dated scripts/ci/allowlists/i14-destructive-migration-coverage.txt entry.
        run: bash scripts/ci/check-destructive-migration-coverage.sh

      - name: tests-are-hermetic guard (FR-4b)
        # upgrade-path-coverage-01PMUG01 WP05, spec §FR-4b. rpc.New's
        # settings store resolves settings.NewFileStoreFromEnv() ->
        # os.UserConfigDir() unless overridden (WithSettingsStore) — a
        # test that forgets the override writes into whatever HOME
        # resolves to for the process running it. This is a RUNTIME
        # check because "a test wrote outside its own t.TempDir()" is
        # not decidable by grep: it runs the scoped suite with HOME /
        # XDG_CONFIG_HOME / AppData pointed at a seeded sentinel
        # directory and fails on any change to that tree.
        run: bash scripts/ci/check-tests-are-hermetic.sh

      - name: audit-store-before-retention guard (G-1)
        # audit-that-tells-the-truth-01PMZA10 WP12, tasks.md §UNIT-10,
        # plan.md Rule 3: "nothing advertises retention before UNIT-8."
        # Fails if anything under core/rpc/ or frontend/src/ claims
        # retention is enforced — a hardcoded RetentionEnforced: true, a
        # scheduled sweep construction site, or a panel string promising
        # a sweep — while core/rpc/api.go's audit.NewAPI( construction
        # carries no audit.WithStore( option. Planted-violation proof:
        # scripts/ci/gates_can_fail_test.go
        # TestAuditStoreBeforeRetentionGate_PlantedStoreRemovalFails.
        run: bash scripts/ci/check-audit-store-before-retention.sh

      - name: fts-sync guard (G-3, new class)
        # audit-that-tells-the-truth-01PMZA10 WP12, tasks.md §UNIT-10.
        # Catches the events_fts-class defect a second time: an
        # external-content FTS5 virtual table with an AFTER INSERT sync
        # trigger and no AFTER DELETE trigger (and no direct
        # 'delete'-command sync) leaves a deleted row's terms matchable
        # AND makes any later SearchFTS on that rowid error with
        # "fts5: missing row N from content table". This class has
        # shipped twice — 0001_events.sql here, and sessions/0335 for
        # messages_fts. Planted-violation proof:
        # scripts/ci/gates_can_fail_test.go
        # "fts-sync/external-content-table-no-delete-sync".
        run: bash scripts/ci/check-fts-sync.sh

      # csp guard runs in test-frontend after `npm run build` produces
      # the real frontend/dist/index.html — there's no point checking
      # the CSP of a stub.

  test-go:
    name: Go tests (-race -short)
    # ci-large (c7g.xlarge, 8 GB) not ci-medium (t4g.medium, 4 GB): the
    # `go test ./core/... -race` suite (5,400+ tests across 229 packages)
    # peaks well past 4 GB under the race detector, OOM-killing the runner
    # mid-job (blank step conclusion + BlobNotFound logs) — especially when
    # several PRs run concurrently and saturate the medium pool. ci-large is
    # an on-demand ephemeral tier (autostarter EPHEMERAL_TIERS=ci-medium,ci-large).
    runs-on: [self-hosted, Linux, ARM64, ci-large]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: false on self-hosted ARM64 runners — they persist
          # /home/go/pkg/mod/ across jobs, so the action's tar-restore
          # collides with existing files ("Cannot open: File exists").
          # Modules carry over naturally; no caching needed.
          cache: false

      - name: go mod download
        run: go mod download

      - name: ensure frontend/dist exists for embed
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: go test
        env:
          # Self-hosted ARM runners ship gcc + glibc-devel via userdata,
          # but `actions/setup-go@v5` sometimes auto-disables CGO when
          # it doesn't detect a compiler at the version-cache path. The
          # `-race` flag requires CGO; pin it on explicitly so the
          # detector can't flip it back to 0.
          CGO_ENABLED: "1"
        # cmd/harness-vm carries the in-VM dispatch RPC service and its
        # audit/privacy + auth tests; ./core/... alone never exercised them
        # (Phase A follow-up B1). The audit lifecycle test is deterministic
        # under -race (accept-sequence ordering in the fake sock).
        #
        # Widened from ./cmd/harness-vm/... to ./cmd/... . —
        # entry-points-and-crash-reporting-01PMZD13 UNIT-1. cmd/kenaz-updater
        # and cmd/mcpsubcmd carried 573 lines of passing tests CI never ran
        # (16 tests, verified green locally before this change). The module
        # root (`.`) carries main_test.go's TestCSPMiddlewareSetsStrictHeaders
        # — privacy CI invariant #1 on the Wails asset-server middleware
        # itself, distinct from check-csp.sh's check of the built HTML — and
        # was covered by nothing until now. cmd/harness-served has no test
        # files and no effect on this pattern (it also requires -tags serve,
        # exercised separately by the lint-go job's serve-tag build step).
        run: go test ./core/... ./cmd/... . -race -count=1 -short

      - name: gate meta-tests
        # scripts/ci/gates_can_fail_test.go plants a violation per CI gate
        # and asserts the gate rejects it — the regression test for gates
        # that pass because they inspected nothing. It was never in any
        # job's package list, so every planted-violation proof added since
        # (I11 unregistered-builtin-tools, I12 single-move-writer, I13
        # cedar-gate-arguments, the check-knob-coverage vacuous-pass fix)
        # was verified only on a developer's machine. A gate could go
        # vacuous and CI would stay green — the exact failure this file
        # exists to prevent.
        #
        # Not merged into the step above: these tests shell out to the
        # check scripts and mutate a scratch tree, so they must not run
        # concurrently with the -race suite (a build racing a mutation
        # poisons the Go build cache under the clean content hash).
        run: go test ./scripts/... -count=1

  wire-golden-locked:
    name: Wire golden tests (locked tier)
    # Locked-tier wire-shape regression gate (integration-test-harness-01KQ8TD1 WP05).
    # Runs all *_WireGolden tests across the LLM adapter + chat view packages.
    # No network keys required — each test drives a real adapter against an
    # httptest.Server that replays recorded fixture responses.
    runs-on: [self-hosted, Linux, ARM64, ci-medium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: go mod download
        run: go mod download

      - name: ensure frontend/dist exists for embed
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: wire golden tests
        env:
          CGO_ENABLED: "1"
        run: go test ./core/llm/... ./core/rpc/views/agentgraph/chat/... -run WireGolden -count=1 -short -race

  upgrade-path:
    name: Upgrade-path coverage
    # upgrade-path-coverage-01PMUG01 WP02. Materialises every committed
    # snapshot under core/storage/sqlite/testdata/upgrade/<tag>/dump.sql
    # (a database a PREVIOUS release produced) and drives it through the
    # production storagesqlite.Open path at HEAD — the class of coverage
    # the v0.63.0 P0 proved the rest of the suite structurally cannot
    # provide (spec.md §1.2: every other test starts from an empty
    # database, where the max-based-selection defect cannot occur).
    runs-on: [self-hosted, Linux, ARM64, ci-medium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: go mod download
        run: go mod download

      - name: ensure frontend/dist exists for embed
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: upgrade-path test
        env:
          CGO_ENABLED: "1"
        run: go test ./core/storage/sqlite/... -run TestUpgradePath -count=1 -short -race -v

  test-frontend:
    name: Frontend tests + typecheck
    # ubuntu-latest hosted runners are reserved for Apple / Microsoft
    # platform builds (kameas-ai org policy). Linux CI runs on the
    # kameas-ci-* self-hosted pool to keep us off the Actions billing cap.
    # ci-large (8 GB) not ci-medium (4 GB): vue-tsc + vitest over the full
    # frontend peak past 4 GB and OOM-killed the medium runner mid-job
    # (runner-died / BlobNotFound signature), flaking this job on ~every PR
    # under concurrency — same fix as test-go. ci-large is an on-demand tier.
    runs-on: [self-hosted, Linux, ARM64, ci-large]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com

      # @kameas-ai/kenaz-design-system is published to GitHub Packages
      # (frontend/.npmrc routes the @kameas-ai scope there). NODE_AUTH_TOKEN
      # from the workflow's own GITHUB_TOKEN has packages:read by default —
      # no new secret needed. Same pattern as kenaz/frontend's ci.yml; see
      # frontend/PACKAGES_AUTH.md.
      - name: npm ci
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: typecheck
        run: npm run typecheck --if-present

      - name: vitest
        run: npm test -- --run

      - name: build frontend (for csp guard)
        run: npm run build

      # The served-mode SPA is a second real bundle with its own outDir
      # (frontend/dist-served) — it is what release.yml packages as
      # kenaz-harness-served-spa.tar.gz and what the workbench image fetches.
      # Build it here so the bundle-size guard weighs both shipped bundles
      # instead of only the desktop one. ~5s.
      - name: build frontend (served, for bundle-size guard)
        run: npm run build:served

      - name: csp guard (desktop)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/check-csp.sh frontend/dist/index.html desktop

      # entry-points-and-crash-reporting-01PMZD13 UNIT-5. Before this, the
      # served-mode SPA (built two steps above) was never CSP-checked at
      # all — this gate only ever inspected the desktop bundle. Filename
      # is served.html, not index.html (frontend/vite.config.ts's outDir/
      # input for BUILD_TARGET=served, confirmed by release.yml:879's own
      # `test -f dist-served/served.html`) and the expected connect-src is
      # 'self', not 'none' — the served browser must reach /rpc and /ws.
      - name: csp guard (served)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/check-csp.sh frontend/dist-served/served.html served

      # Non-blocking, and deliberately so — but NOT because the number is
      # unknown. As measured by this job on this runner pool against main at
      # a7f3e87 (2026-08-08): the desktop bundle is 1,579,582 bytes gzipped
      # JS+CSS against the 1,500,000-byte NFR-006 budget — 79,582 bytes OVER
      # — and the served bundle is 1,422,393 bytes (77,607 bytes of
      # headroom). So this step fails on unmodified main today, and making it
      # required would block every PR.
      #
      # Expect ~0.4% drift between runners: the same commit measured
      # 1,572,873 / 1,416,109 on a macOS/arm64 dev box. Treat the CI figure
      # as authoritative and never tune the budget to a laptop number.
      #
      # It read "pass" for months only because it resolved dist/assets
      # against the repo root, found nothing, and took its own not-built
      # early-exit without gzipping a byte. That is fixed; the annotation in
      # the Checks UI is now the real number.
      #
      # Before dropping continue-on-error (and adding this job to ruleset
      # 15871858's required checks), one of:
      #   1. bring the desktop bundle under 1.5 MB — mermaid, cytoscape and
      #      wardley are the bulk of it and are async-import candidates; or
      #   2. have the operator ratify a revised NFR-006 budget and raise
      #      BUDGET_BYTES in scripts/ci/check-bundle-size.mjs to match.
      # Either way, re-measure and update these numbers in the same change.
      # Do not re-silence this by making the path cwd-relative again.
      - name: bundle-size guard
        working-directory: ${{ github.workspace }}
        run: node scripts/ci/check-bundle-size.mjs
        continue-on-error: true

      - name: css-tokens guard
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f scripts/ci/check-css-tokens.mjs ]; then
            node scripts/ci/check-css-tokens.mjs
          fi
        continue-on-error: true

  # NOTE: the previous `build-smoke` job (Wails build of main.go on
  # ubuntu-latest with GTK/WebKit apt deps) was removed in v0.8.5. The
  # kameas-ai self-hosted runner pool is not Debian-family (no apt) and
  # cross-platform release builds already happen in release.yml against
  # tagged versions on the proper OS runners (macos-latest,
  # windows-latest, and a future self-hosted Linux amd64). PR-time CI
  # is now: pr-title (semantic) + lint-go + test-go (-race) +
  # test-frontend (vitest + typecheck). Re-add a smoke build only if
  # we get a self-hosted runner image with the Linux Wails toolchain
  # pre-installed.
