name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # test-frontend's `npm ci` installs @kameas-ai/kenaz-design-system from
  # GitHub Packages — an explicit `permissions:` block zeroes out every
  # unlisted scope (including packages), so this has to be listed
  # explicitly or GITHUB_TOKEN can't authenticate against npm.pkg.github.com.
  packages: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  lint-go:
    name: Go lint + vet + codegen drift
    runs-on: [self-hosted, Linux, ARM64, ci-medium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: false on self-hosted ARM64 runners — they persist
          # /home/go/pkg/mod/ across jobs, so the action's tar-restore
          # collides with existing files ("Cannot open: File exists").
          # Modules carry over naturally; no caching needed.
          cache: false

      - name: go mod download
        run: go mod download

      - name: ensure frontend/dist exists for embed
        # main.go uses //go:embed all:frontend/dist. Without this stub
        # the typecheck pass inside golangci-lint fails on a clean
        # checkout because no frontend build has run yet.
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: go vet
        run: go vet ./core/...

      - name: golangci-lint
        # v8 supports golangci-lint v2.x, which is built with go1.25 and can
        # load configs targeting Go 1.25.0 (go.mod's `go` directive).
        # only-new-issues: true scopes failures to PR-introduced issues so
        # the lint gate does not fail on the existing debt the codebase
        # accumulated while lint was misconfigured. Burn down the
        # backlog opportunistically; do not block PRs on it.
        #
        # continue-on-error: true matches the documented intent (don't
        # block on lint) and ALSO works around golangci-lint-action's
        # 300-file diff API limit which fails any PR with > 300 changed
        # files (e.g. our v0.2.0 release PR which bundles 83 commits).
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        continue-on-error: true
        with:
          version: v2.5.0
          args: --timeout=5m
          working-directory: .
          only-new-issues: true

      - name: codegen idempotent
        run: bash scripts/ci/check-codegen.sh

      - name: bindings-name guard
        run: bash scripts/ci/check-binding-names.sh

      - name: emitter-isolation guard
        run: bash scripts/ci/check-emitter-isolation.sh

      - name: wailsjs-isolation guard
        run: bash scripts/ci/check-wailsjs-isolation.sh

      - name: single-persistence-file guard
        run: bash scripts/ci/check-single-persistence-file.sh

      - name: test-only-symbols guard
        run: bash scripts/ci/check-test-only-symbols.sh

      - name: no-credential-in-ui guard
        run: bash scripts/ci/check-no-credential-in-ui.sh

      - name: no-user-content-in-slog guard
        run: bash scripts/ci/check-no-user-content-in-slog.sh

      - name: fleet log-export fence guard
        # The harness must not ship its raw slog stream to Fleet. Verifies the
        # compiled kind ceiling + its anti-drift gate exist, the wire-level
        # regression tests still exist, and no OTLP *log* exporter is
        # constructed without an explicit opt-out annotation.
        run: bash scripts/ci/check-fleet-log-export-fence.sh

      - name: fleet kind-schema parity (cross-repo)
        # Compares the vendored core/fleet/schema/kinds.json against
        # kenaz-fleet's schema v1 when a checkout is available. Skips
        # (does not fail) when kenaz-fleet is not checked out — the private
        # sibling repo is not cloned in harness CI today, so this runs green
        # locally for engineers and in the workspace cross-repo job.
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -run 'TestVendoredKindSchema' ./core/fleet/

      - name: no-fleet-imports guard
        # Enforces OSS-first contract: only core/rpc/views/settings/ is
        # permitted to import core/fleet/. Passes when core/fleet/ is
        # absent (fork case). — fleet-auth-foundation-01NDFSEX08 WP07
        run: bash scripts/ci/check-no-fleet-imports.sh

      - name: no-model-family-literals guard
        # Bans hardcoded model-family name literals (claude, gemini,
        # haiku, opus, sonnet, gpt-, o1, mini, nano, ultra) in core logic
        # outside core/llm/** — closes the tierFromModelID frozen-core
        # violation this WP fixed in core/agentgraph. A same-line
        # `// model-lit-allow: <reason>` comment opts out a genuine
        # non-classification reference. — versioned-model-profile-01PMDL04 WP04
        run: bash scripts/ci/check-no-model-family-literals.sh

      - name: oss-first guard
        # Verifies non-fleet packages + frontend tests pass with
        # HARNESS_FLEET_DISABLED=1. — fleet-auth-foundation-01NDFSEX08 WP07
        # Frontend step is skipped in worktrees where node_modules are absent
        # (it runs fully in test-frontend which does npm ci first).
        run: bash scripts/ci/check-oss-first.sh

      - name: serve-dispatch drift report
        # FR-005: informational check — lists desktop Bindings methods not yet
        # wired in the serve-mode RPC dispatcher so the gap is visible in CI
        # logs.  Exits 0 (never blocks a PR) until SERVE_DRIFT_GATE=1 is set.
        run: bash scripts/ci/check-serve-dispatch-drift.sh

      # csp guard runs in test-frontend after `npm run build` produces
      # the real frontend/dist/index.html — there's no point checking
      # the CSP of a stub.

  test-go:
    name: Go tests (-race -short)
    # ci-large (c7g.xlarge, 8 GB) not ci-medium (t4g.medium, 4 GB): the
    # `go test ./core/... -race` suite (5,400+ tests across 229 packages)
    # peaks well past 4 GB under the race detector, OOM-killing the runner
    # mid-job (blank step conclusion + BlobNotFound logs) — especially when
    # several PRs run concurrently and saturate the medium pool. ci-large is
    # an on-demand ephemeral tier (autostarter EPHEMERAL_TIERS=ci-medium,ci-large).
    runs-on: [self-hosted, Linux, ARM64, ci-large]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: false on self-hosted ARM64 runners — they persist
          # /home/go/pkg/mod/ across jobs, so the action's tar-restore
          # collides with existing files ("Cannot open: File exists").
          # Modules carry over naturally; no caching needed.
          cache: false

      - name: go mod download
        run: go mod download

      - name: ensure frontend/dist exists for embed
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: go test
        env:
          # Self-hosted ARM runners ship gcc + glibc-devel via userdata,
          # but `actions/setup-go@v5` sometimes auto-disables CGO when
          # it doesn't detect a compiler at the version-cache path. The
          # `-race` flag requires CGO; pin it on explicitly so the
          # detector can't flip it back to 0.
          CGO_ENABLED: "1"
        # cmd/harness-vm carries the in-VM dispatch RPC service and its
        # audit/privacy + auth tests; ./core/... alone never exercised them
        # (Phase A follow-up B1). The audit lifecycle test is deterministic
        # under -race (accept-sequence ordering in the fake sock).
        run: go test ./core/... ./cmd/harness-vm/... -race -count=1 -short

  wire-golden-locked:
    name: Wire golden tests (locked tier)
    # Locked-tier wire-shape regression gate (integration-test-harness-01KQ8TD1 WP05).
    # Runs all *_WireGolden tests across the LLM adapter + chat view packages.
    # No network keys required — each test drives a real adapter against an
    # httptest.Server that replays recorded fixture responses.
    runs-on: [self-hosted, Linux, ARM64, ci-medium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: go mod download
        run: go mod download

      - name: ensure frontend/dist exists for embed
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: wire golden tests
        env:
          CGO_ENABLED: "1"
        run: go test ./core/llm/... ./core/rpc/views/agentgraph/chat/... -run WireGolden -count=1 -short -race

  test-frontend:
    name: Frontend tests + typecheck
    # ubuntu-latest hosted runners are reserved for Apple / Microsoft
    # platform builds (kameas-ai org policy). Linux CI runs on the
    # kameas-ci-* self-hosted pool to keep us off the Actions billing cap.
    # ci-large (8 GB) not ci-medium (4 GB): vue-tsc + vitest over the full
    # frontend peak past 4 GB and OOM-killed the medium runner mid-job
    # (runner-died / BlobNotFound signature), flaking this job on ~every PR
    # under concurrency — same fix as test-go. ci-large is an on-demand tier.
    runs-on: [self-hosted, Linux, ARM64, ci-large]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com

      # @kameas-ai/kenaz-design-system is published to GitHub Packages
      # (frontend/.npmrc routes the @kameas-ai scope there). NODE_AUTH_TOKEN
      # from the workflow's own GITHUB_TOKEN has packages:read by default —
      # no new secret needed. Same pattern as kenaz/frontend's ci.yml; see
      # frontend/PACKAGES_AUTH.md.
      - name: npm ci
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: typecheck
        run: npm run typecheck --if-present

      - name: vitest
        run: npm test -- --run

      - name: build frontend (for csp guard)
        run: npm run build

      # The served-mode SPA is a second real bundle with its own outDir
      # (frontend/dist-served) — it is what release.yml packages as
      # kenaz-harness-served-spa.tar.gz and what the workbench image fetches.
      # Build it here so the bundle-size guard weighs both shipped bundles
      # instead of only the desktop one. ~5s.
      - name: build frontend (served, for bundle-size guard)
        run: npm run build:served

      - name: csp guard
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/check-csp.sh

      # Non-blocking, and deliberately so — but NOT because the number is
      # unknown. As measured on main at a7f3e87 (2026-08-08): the desktop
      # bundle is 1,572,873 bytes gzipped JS+CSS against the 1,500,000-byte
      # NFR-006 budget — 72,873 bytes OVER — and the served bundle is
      # 1,416,109 bytes (83,891 bytes of headroom). So this step fails on
      # unmodified main today, and making it required would block every PR.
      #
      # It read "pass" for months only because it resolved dist/assets
      # against the repo root, found nothing, and took its own not-built
      # early-exit without gzipping a byte. That is fixed; the annotation in
      # the Checks UI is now the real number.
      #
      # Before dropping continue-on-error (and adding this job to ruleset
      # 15871858's required checks), one of:
      #   1. bring the desktop bundle under 1.5 MB — mermaid, cytoscape and
      #      wardley are the bulk of it and are async-import candidates; or
      #   2. have the operator ratify a revised NFR-006 budget and raise
      #      BUDGET_BYTES in scripts/ci/check-bundle-size.mjs to match.
      # Either way, re-measure and update these numbers in the same change.
      # Do not re-silence this by making the path cwd-relative again.
      - name: bundle-size guard
        working-directory: ${{ github.workspace }}
        run: node scripts/ci/check-bundle-size.mjs
        continue-on-error: true

      - name: css-tokens guard
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f scripts/ci/check-css-tokens.mjs ]; then
            node scripts/ci/check-css-tokens.mjs
          fi
        continue-on-error: true

  # NOTE: the previous `build-smoke` job (Wails build of main.go on
  # ubuntu-latest with GTK/WebKit apt deps) was removed in v0.8.5. The
  # kameas-ai self-hosted runner pool is not Debian-family (no apt) and
  # cross-platform release builds already happen in release.yml against
  # tagged versions on the proper OS runners (macos-latest,
  # windows-latest, and a future self-hosted Linux amd64). PR-time CI
  # is now: pr-title (semantic) + lint-go + test-go (-race) +
  # test-frontend (vitest + typecheck). Re-add a smoke build only if
  # we get a self-hosted runner image with the Linux Wails toolchain
  # pre-installed.
