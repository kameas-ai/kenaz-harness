<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="__CSP_PLACEHOLDER__" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kenaz-harness</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <!--
      harness-token is injected by core/serve's static file handler so the
      served frontend can authenticate against /rpc and /ws without
      embedding the token in the build artifact.  The Go side renders this
      page on every GET / request.
    -->
    <!--HARNESS_TOKEN_META-->
    <!--
      Host theme param, read synchronously before first paint (P0 theme
      fix — see useTheme.ts hostThemeParam/applyHostTheme, spec 073 FR-2/
      CONTRACTS.md § kenaz.workbench.surface-theme-param v1). This is the
      path that actually matters: served.html is what the kenaz chrome
      iframes at `${forwarderUrl}?theme=<name>` (AppIframes.tsx
      surfaceSrc), so this is where the dark-flash-on-paper/linen bug was
      visible. Sets data-theme on <html> before the critical <style> block
      below is parsed. Standalone (no param) falls through to the
      prefers-color-scheme block. Kept in sync with index.html.
    -->
    <script>
      (function () {
        var HOST_THEMES = ['ink', 'linen', 'azure', 'paper'];
        var m = /[?&]theme=([a-z]+)/.exec(location.search);
        var t = m && HOST_THEMES.indexOf(m[1]) !== -1 ? m[1] : null;
        if (t) document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!--
      Critical token block — keep in sync with index.html.
    -->
    <style>
      :root { color-scheme: dark; --surface-0:#0A0A0B; --ink:#F4F1EA; --accent:#C8A56A; }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --surface-0:#F4EFE4; --ink:#1A1814; --accent:#8F6B26; }
      }
      :root[data-theme="ink"]   { color-scheme: dark;  --surface-0:#0A0A0B; --ink:#F4F1EA; --accent:#C8A56A; }
      :root[data-theme="azure"] { color-scheme: dark;  --surface-0:#0B1C2E; --ink:#E8EFF6; --accent:#C8A56A; }
      :root[data-theme="linen"] { color-scheme: light; --surface-0:#F4EFE4; --ink:#1A1814; --accent:#8F6B26; }
      :root[data-theme="paper"] { color-scheme: light; --surface-0:#F4EEDF; --ink:#201D16; --accent:#2F5380; }
      html, body { margin: 0; background: var(--surface-0); color: var(--ink); }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/src/main-served.ts" type="module"></script>
</body>
</html>
