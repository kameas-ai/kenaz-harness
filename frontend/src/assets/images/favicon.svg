<?xml version="1.0" encoding="UTF-8"?>
<!--
  Browser-tab favicon for docs.kameas.ai. Dark rounded square so the
  mark stays legible on browsers that show favicons against a light
  tab strip; cream dot-grid on top using the same 4x4 layout as the
  navbar logo, with the dots scaled up further for 16×16 / 32×32
  rendering. Same #F4F1EA cream / #0A0A0B surface as the rest of
  the Kenaz design language.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" ry="12" fill="#0A0A0B"/>
  <g fill="#F4F1EA">
    <circle cx="14" cy="14" r="6"/>
    <circle cx="32" cy="14" r="6"/>
    <circle cx="50" cy="14" r="6"/>
    <circle cx="14" cy="32" r="6"/>
    <circle cx="32" cy="32" r="6"/>
    <circle cx="50" cy="32" r="6"/>
    <circle cx="14" cy="50" r="6"/>
    <circle cx="32" cy="50" r="6"/>
    <circle cx="50" cy="50" r="6"/>
  </g>
</svg>
