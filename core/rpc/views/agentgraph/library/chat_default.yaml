# Default chat graph: per-session kernel run that pauses on AskNode
# between user turns. Replaces core/toolloop as the chassis chat path
# (mission agent-kernel-graph-chat-migration).
#
# Topology (post-cutover, v1 alpha):
#
#   history_in (history_read) → ask_user (ask) → assistant_turn (model)
#                                                  → assistant_write (session_write)
#
# Per-session lifecycle:
#   - The chassis (core/rpc/views/agentgraph/chat) starts one Kernel.Run
#     per chat StartStream. The runner pre-seeds the AskBus with the
#     user's message so ask_user resolves on its first fire.
#   - assistant_turn fires once; its assistant output flows into
#     assistant_write which persists the assistant turn via the
#     HistoryWriter seam (SessionWriteNode).
#   - SessionWriteNode fires the kernel HookManager's post-LLM listener
#     callbacks, including the artifacts code-block detector.
#
# Tool loop:
#   - V1 alpha pushes tool dispatch into a single assistant_turn fire.
#     Multi-turn agent loops (re-pump on tool_use) require a kernel
#     ToolNode that dispatches dynamically from upstream tool_calls;
#     adding that primitive is a follow-up mission. Until then a
#     tool_use response from the assistant lands as the model's final
#     turn for that StartStream — the tool_use envelope is persisted
#     verbatim and the chassis surface renders the tool_call request
#     to the user.
#
# Streaming:
#   - The chassis wires env.StreamSink before each Run start (WP01 of
#     the chat-migration mission). The model executor pins the sink
#     onto its provider call ctx; the chassis's chassis-bound LLM
#     provider pumps StreamEvents into the sink as the upstream
#     stream is consumed. The sink fans events onto the existing
#     llm:stream-chunk broker topic so the chat surface keeps
#     receiving byte-equal deltas without a frontend change.
#
# Iteration cap:
#   - MaxAgentTurns is enforced by the chat runner at the chassis
#     level — the runner re-runs the kernel up to N times when the
#     model emits tool_use. v1 alpha defers this; one assistant_turn
#     fire per StartStream.
spec_version: "1"
id: "chat_default"
name: "Default chat graph"
description: |
  Per-session kernel run that replaces core/toolloop as the chassis
  chat path. Pauses on AskNode between user turns; the chassis
  resumes on the next user message.
entrypoints:
  - history_in
budget:
  max_llm_calls_per_run: 100
  max_tool_calls_per_run: 200
  max_tokens_per_run: 200000
nodes:
  - id: history_in
    kind: history_read
    title: "Load conversation history"
    attrs:
      n: 0

  - id: ask_user
    kind: ask
    title: "Wait for user message"
    attrs:
      question: "(filled by chassis on resume)"

  - id: assistant_turn
    kind: model
    title: "Assistant turn (streamed)"
    attrs:
      model: "default"
      stream_to_chat: true
      max_tokens: 4096

  - id: assistant_write
    kind: session_write
    title: "Persist assistant turn to session history"
    attrs:
      role: assistant
      text_input_port: text

edges:
  - from: { node: history_in, port: messages }
    to:   { node: ask_user, port: context }
  - from: { node: ask_user, port: answer }
    to:   { node: assistant_turn, port: messages }
  - from: { node: assistant_turn, port: assistant }
    to:   { node: assistant_write, port: text }
