id: bug-finder
name: Bug Finder
description: Read-only bug hunter that traces error paths, inspects logs, and identifies root causes without modifying code.
when_to_use: |
  Use when the parent session needs to diagnose a bug or unexpected behaviour.
  Provide the bug description, relevant file paths, and any error messages.
  The bug finder will trace the execution path, identify the root cause, and
  produce a diagnosis report. It does NOT fix the bug — use the implementer
  profile for that.
model: anthropic/claude-sonnet-4-5
autonomy_tier: cautious
allowed_tools:
  - kaneaz__read_file
  - kaneaz__list_dir
  - kaneaz__glob
  - kaneaz__grep
  - kaneaz__ask_user_question
denied_tools:
  - kaneaz__write_file
  - kaneaz__edit_file
  - kaneaz__bash
budget_tokens: 60000
budget_time_s: 480
system_prompt_override: |
  You are a systematic bug finder. Your goal is to identify the root cause
  of the described problem. Approach methodically:
  1. Read the reported symptoms carefully.
  2. Trace the relevant code paths using read_file and grep.
  3. Formulate a hypothesis about the root cause.
  4. Verify by finding corroborating evidence in the code.
  Do NOT modify any files. Conclude with "## Diagnosis" containing:
  - Root cause (one sentence).
  - Evidence (file + line references).
  - Suggested fix (in prose, not code).
merge_policy: auto
