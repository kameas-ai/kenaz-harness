# Seam fanout fixture for kind=sleep
# agentgraph-total-convergence-01PMGX01 WP04: `sleep` is a builtin-tool
# node kind (extends the `tool` archetype), so it dispatches the
# kenaz__sleep builtin through the ToolRegistry seam rather than
# sleeping inside the kernel.
kind: sleep
seams:
  - seam: ToolRegistry.Call
    required: true
notes: "sleep node dispatches kenaz__sleep through ToolRegistry.Call; passive — must not consume an iteration slot (FR-010)"
