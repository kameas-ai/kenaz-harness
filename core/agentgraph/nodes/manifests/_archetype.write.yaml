schema_version: "1"
archetype: write
extends: state
description: "Writes content into durable harness state (memory, corpus, trace, file, artifact)."
callable: false
ports:
  inputs:
    - { name: payload, type: any }
  outputs:
    - { name: ack, type: bool }
attrs:
  target:
    type: enum
    enum: [memory, corpus, trace, file, artifact]
    description: "Discriminator naming the write target. Each kind under `write` sets its own default via the `defaults:` map."
budget: none
