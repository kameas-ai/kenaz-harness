schema_version: "1"
manifest_version: "1.0.0"
id: model
extends: compute
display_name: Model
description: "LLM-powered reasoning/generation node (FR-030)."
aliases: [llm]
executor: agentgraph.ExecModel
ports:
  inputs:
    - { name: messages, type: messages, required: true }
  outputs:
    - { name: response, type: messages }
attrs:
  model:
    type: string
    required: true
    description: "Provider-specific model name."
  json_schema:
    type: object
    description: "Optional JSON schema constraint for structured output."
  stream_to_chat:
    type: bool
    description: "When true, stream tokens directly to the active chat surface."
  fallback_chain_id:
    type: string
    description: "Optional fallback chain ID to use when this node's primary model call fails (model-fallback-routing-01NDFSEX04). Overrides session and app-level defaults."
budget: llm
budget_consumes: [tokens, llm_calls, cost_usd]
