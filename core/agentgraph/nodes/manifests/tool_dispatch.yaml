schema_version: "1"
manifest_version: "1.1.0"
id: tool_dispatch
extends: compute
display_name: Tool Dispatch
description: "Dispatches every tool_use record on the input port through the kernel ToolRegistry. Emits tool_results on the output port. Used inside chat LoopNode bodies to close the model→tool→model cycle."
executor: agentgraph.ExecToolDispatch
dispatch: graph
ports:
  inputs:
    - { name: tool_calls, type: any, required: true }
    # The upstream model turn's outputs. tool_dispatch reads them to
    # build `messages` and to pass the assistant turn through to an
    # outside-loop session_write (passthroughAssistant in
    # exec_dispatch.go). They were undeclared before
    # agentgraph-total-convergence-01PMGX01 Phase 2.
    - { name: response, type: messages }
    - { name: assistant, type: any }
    - { name: finish_reason, type: text }
  outputs:
    # manifest_version 1.1.0 reconciles this list with what
    # exec_dispatch.go actually emits. Every port below is written by
    # toolDispatchExecutor.Execute; before this bump the manifest
    # declared only the first two, so `tool_call_count` — the port
    # chat_default's agent_loop breaks its loop on — was invisible to
    # the validator and to every tool that reads the node surface.
    - { name: tool_results, type: any }
    - { name: messages, type: messages }
    - { name: tool_messages, type: messages }
    - { name: tool_call_count, type: number }
    # Pass-through of the upstream assistant turn, so a session_write
    # placed outside the loop can read the terminal turn off the
    # LoopNode's flattened outputs.
    - { name: assistant, type: any }
    - { name: assistant_text, type: text }
    - { name: response, type: messages }
    - { name: finish_reason, type: text }
    # Doom-loop guard signals (autonomy-recovery-runtime-01PMDL03 WP02).
    # Emitted only when the (tool, normalized-args) repeat threshold
    # trips; declared so a controller can wire against them.
    - { name: should_replan, type: bool }
    - { name: doom_loop_hits, type: any }
attrs:
  parallel_dispatch:
    type: bool
    # NARROWED (controls-and-readouts-that-tell-the-truth-01PMZ808
    # UNIT-16 WP21, FR-031, register X-6, 2026-08-21). Re-derivation
    # found the WIRE this finding originally prescribed is unsafe to
    # ship: exec_dispatch.go's Node.Attrs is re-encoded from the raw
    # YAML map into this typed struct during loading, and the raw map
    # (which would carry "key present" information) is discarded — see
    # core/agentgraph/spec.go's Node.Attrs doc. A plain `bool` with
    # `omitempty` cannot distinguish "the author wrote false" from "the
    # author never mentioned this key" after that point; both decode to
    # Go's zero value. `*bool` would resolve the ambiguity but is
    # forbidden (spec D-7 — it would trigger the full codegen ritual).
    # Gating dispatch on this field would therefore silently flip EVERY
    # tool_dispatch node that omits the key — including future
    # model-authored or dropped-override graphs this repo does not
    # control — from parallel to serial, which is the exact class of
    # silent default-flip regression this mission exists to prevent,
    # not merely relocated to a new field. `justify(blocker: "no
    # load-time key-presence check exists to distinguish omitted from
    # explicit-false; adding one is new validation infrastructure, not
    # a one-field wire", owner: alec, date: 2026-08-21)`.
    description: "NOT CONSUMED. max_concurrent: 1 is the only lever that selects serial dispatch (core/agentgraph/exec_dispatch.go); this field is accepted, generated, and documented but exec_dispatch.go never reads it. Every shipped graph sets it to true for readability, but the value is inert either way."
  max_concurrent:
    type: int
    min: 1
    max: 16
    description: "Cap when parallel_dispatch=true (default 4)."
budget: tool
budget_consumes: [tool_calls]
