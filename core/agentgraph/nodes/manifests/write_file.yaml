schema_version: "1"
manifest_version: "1.0.0"
id: write_file
extends: write
display_name: Write File
description: "Writes content to a file with policy gating + provenance (FR-057c). The kenaz__write_file builtin tool writes the same way; both surfaces record path/sha256/mtime provenance to the EventLog (core/agentgraph/tool_invocation.go)."
executor: agentgraph.ExecWriteFile
dispatch: graph
ports:
  inputs:
    - { name: payload, type: any }
  outputs:
    - { name: ack, type: bool }
defaults:
  target: file
attrs:
  path:
    type: string
    required: true
    description: "Absolute path of the file to write."
  content:
    type: messages_ref
    required: true
    description: "Port reference to the content payload."
  mode:
    type: enum
    enum: [create, append, replace]
    description: "Write mode (default create)."
  policy_label:
    type: string
    description: "Optional Cedar policy label evaluated alongside the file path."
budget: none
