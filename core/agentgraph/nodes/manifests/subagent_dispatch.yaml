schema_version: "1"
manifest_version: "2.0.0"
id: subagent_dispatch
extends: tool
display_name: Subagent Dispatch
description: "Spawns a sub-agent branch from the named profile (branch-subagent-interactive-01KZNP3B). The kernel forks the parent session into a child branch configured by the profile."
# Integration note (2026-08-12): resolved per nodes review §C Option A —
# real archetype-derived executor wins over wiring's `dispatch: builtin_tool`
# declaration; dispatch: graph inherited from _archetype.tool.yaml.
executor: agentgraph.ExecSubagentDispatch
attrs:
  profile:
    type: string
    required: true
    description: "ID of the sub-agent profile to use (e.g. explore, code-reviewer)."
  prompt:
    type: string
    required: true
    description: "Task prompt sent to the spawned worker as its first user message."
  run_in_background:
    type: bool
    description: "When true (default), the parent continues while the worker runs. When false, the parent blocks until the merge summary is ready."
    default: true
  isolation:
    type: string
    description: "Isolation level: session (default) or worktree (deferred — requires worktree mission)."
    default: session
  description:
    type: string
    description: "Optional human-readable label shown in the BranchSidebar."
