schema_version: "1"
archetype: read
extends: state
description: "Reads from durable harness state into the active context."
callable: false
ports:
  inputs:
    - { name: query, type: any }
  outputs:
    - { name: result, type: messages }
attrs:
  source:
    type: enum
    enum: [history, corpus, memory, attachment, file, bash_output]
    description: "Discriminator naming the read source. Each kind under `read` sets its own default via the `defaults:` map."
budget: none
