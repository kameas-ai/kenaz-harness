schema_version: "1"
manifest_version: "1.0.0"
id: read_bash_output
extends: read
display_name: Read Bash Output
description: "Reads cached stdout/stderr from a prior bash tool run as a context-tracked artifact (FR-057b). No tool or MCP surface duplicates this — the cache it reads is kernel-internal."
executor: agentgraph.ExecReadBashOutput
dispatch: graph
ports:
  inputs:
    - { name: query, type: any }
  outputs:
    - { name: result, type: messages }
defaults:
  source: bash_output
attrs:
  bash_run_id:
    type: string
    required: true
    description: "Identifier of a prior bash tool run whose output to read."
  tail_bytes:
    type: int
    min: 0
    description: "Tail-N bytes of output to return; 0 returns the full cached output."
  include_stderr:
    type: bool
    description: "When true (default), prepend stderr to stdout in the returned content."
budget: none
