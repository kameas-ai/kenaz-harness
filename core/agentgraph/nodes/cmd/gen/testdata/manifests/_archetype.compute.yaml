schema_version: "1"
archetype: compute
category: compute
description: "Reasoning/generation work that consumes LLM/tool budget."
callable: false
ports:
  inputs:
    - { name: input, type: messages }
  outputs:
    - { name: output, type: messages }
attrs:
  provider:
    type: string
    description: "LLM provider identifier."
  model:
    type: string
    description: "Provider-specific model name."
  max_tokens:
    type: int
    min: 0
    description: "Upper bound on generated tokens."
  temperature:
    type: float
    min: 0.0
    max: 2.0
    description: "Sampling temperature."
budget: llm
