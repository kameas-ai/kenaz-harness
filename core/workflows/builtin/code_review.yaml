id: code_review
name: "Code Review"
description: |
  Automated PR code review. Fetches the raw diff from a GitHub pull request
  URL, synthesises a high-level summary, runs a bug/issue scan that outputs
  a JSON array, then renders a formatted markdown PR comment ready to post.
version: 1
inputs:
  - name: pr_url
    kind: string
    required: true
    default: "https://github.com/owner/repo/pull/1"
steps:
  - name: fetch_diff
    kind: http_request
    url: "${input.pr_url}.diff"
    method: GET
    headers:
      Accept: "text/plain"

  - name: summarize_changes
    kind: model_turn
    user_prompt: |
      Produce a high-level summary (3-5 sentences) of the changes in the
      following GitHub pull request diff. Focus on WHAT changed and WHY it
      might have been changed, not line-by-line details.

      DIFF:
      ${step.fetch_diff.output}

  - name: find_issues
    kind: model_turn
    user_prompt: |
      Review the following GitHub pull request diff for bugs, logic errors,
      security issues, and style violations. Output ONLY a JSON array where
      each element is an object with keys: "file", "line", "severity"
      (info|warning|error), "message". Empty array if no issues found.

      DIFF:
      ${step.fetch_diff.output}

  - name: format_comment
    kind: transform
    inputs_from: [summarize_changes, find_issues]
    template: |
      ## PR Review

      ### Summary
      ${step.summarize_changes.output}

      ### Issues Found
      ```json
      ${step.find_issues.output}
      ```

      *Generated by the Code Review workflow.*
