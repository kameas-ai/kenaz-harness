  - struct: StreamEvent
    field: Err
    adapter: bedrock
    tests: [TestBedrockAdapter_Err_ErrParsed]

  # Raw — opaque raw SSE frame bytes; optional pass-through; not emitted by production pump
  - struct: StreamEvent
    field: Raw
    adapter: anthropic
    unsupported: "raw pass-through field; not emitted by production pump"
  - struct: StreamEvent
    field: Raw
    adapter: openai
