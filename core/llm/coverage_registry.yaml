  - struct: Response
    field: Content
    adapter: openai
    tests: [TestOpenAIAdapter_ChatDefault_ResponseParsed]
  - struct: Response
    field: Content
    adapter: openrouter
    tests: [TestOpenRouterAdapter_ChatDefault_ResponseParsed]
  - struct: Response
    field: Content
    adapter: bedrock
    tests: [TestBedrockAdapter_ChatDefault_ResponseParsed]

  # ToolCalls — assembled tool invocations
