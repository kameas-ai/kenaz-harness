# coverage_registry.yaml — wire-shape test coverage matrix
#
# Schema: docs/coverage-registry-schema.md
# Completeness enforced by: core/llm/wirecheck/registry_completeness_test.go
#
# Every (struct, field, adapter) triple must have either:
#   tests: [<FuncName>, ...]      — at least one real test function
#   unsupported: "<reason>"       — explicit reason the adapter omits this field
#
# WP02 replaced all WP01 placeholder rows with real test function references.
#
# Friction is the feature: adding a field to GenerationRequest/Response/StreamEvent
# without updating this file fails TestRegistryCompleteness with a clear message.
#
version: 1
entries:

  # ============================================================
  # GenerationRequest fields
  # ============================================================

  # ProfileID — internal routing key; never sent on the wire
  - struct: GenerationRequest
    field: ProfileID
    adapter: anthropic
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: openai
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: openrouter
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: bedrock
    unsupported: "internal routing key — never sent on the wire"
  # azure-openai / custom-openai (model-settings-reach-the-model-01PMZ101
  # WP12, G-3): inScopeAdapters widened to include the two adapters this
  # same mission's WP02/WP03/WP08 built full tool/image/reasoning wire
  # parity for. "adapter:" here is the registered Kind string
  # (core/llm/azure.Kind / core/llm/custom.Kind), not the package
  # directory name — collectTestFunctions' adapterDirs maps this back to
  # core/llm/azure and core/llm/custom respectively. gemini and ollama
  # are NOT widened in — see this file's closing comment for the dated
  # scoping decision.
  - struct: GenerationRequest
    field: ProfileID
    adapter: azure-openai
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: custom-openai
    unsupported: "internal routing key — never sent on the wire"

  # Model — per-request model override; verified via URL path or request body
  - struct: GenerationRequest
    field: Model
    adapter: anthropic
    tests: [TestAnthropicAdapter_ModelOverride_ModelSerialized]
  - struct: GenerationRequest
    field: Model
    adapter: openai
    tests: [TestOpenAIAdapter_ModelOverride_ModelSerialized]
  - struct: GenerationRequest
    field: Model
    adapter: openrouter
    tests: [TestOpenRouterAdapter_ModelOverride_ModelSerialized]
  - struct: GenerationRequest
    field: Model
    adapter: bedrock
    tests: [TestBedrockAdapter_ModelOverride_ModelSerialized]
  - struct: GenerationRequest
    field: Model
    adapter: azure-openai
    # Azure resolves the model via the deployment name in the URL path,
    # not a "model" body field — this is the deployment-resolution
    # equivalent of a model override.
    tests: [TestAdapter_Stream_DeploymentURL_FromRegistry]
  - struct: GenerationRequest
    field: Model
    adapter: custom-openai
    tests: [TestStreamWireShape]

  # System — top-level system prompt
  - struct: GenerationRequest
