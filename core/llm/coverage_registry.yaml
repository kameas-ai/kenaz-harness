  - struct: StreamEvent
    field: Reasoning
    adapter: anthropic
    tests: [TestAnthropicAdapter_Reasoning_ReasoningParsed]
  - struct: StreamEvent
    field: Reasoning
    adapter: openai
    unsupported: "OpenAI does not emit a structured reasoning event; chain-of-thought arrives as text deltas"
  - struct: StreamEvent
    field: Reasoning
    adapter: openrouter
    unsupported: "OpenRouter passes through upstream SSE; no structured reasoning event shape at this layer"
  - struct: StreamEvent
    field: Reasoning
    adapter: bedrock
    unsupported: "Bedrock does not emit structured reasoning events via the generic runtime SDK"

  # Usage — token snapshot on kind=usage events
  - struct: StreamEvent
    field: Usage
    adapter: anthropic
    tests: [TestAnthropicAdapter_Usage_UsageParsed]
  - struct: StreamEvent
    field: Usage
    adapter: openai
    tests: [TestOpenAIAdapter_ChatDefault_ResponseParsed]
  - struct: StreamEvent
    field: Usage
    adapter: openrouter
    tests: [TestOpenRouterAdapter_ChatDefault_ResponseParsed]
  - struct: StreamEvent
    field: Usage
