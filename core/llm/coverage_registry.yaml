    adapter: anthropic
    tests: [TestAnthropicAdapter_ChatDefault_ResponseParsed]
  - struct: StreamEvent
    field: Text
    adapter: openai
    tests: [TestOpenAIAdapter_ChatDefault_ResponseParsed]
  - struct: StreamEvent
    field: Text
    adapter: openrouter
    tests: [TestOpenRouterAdapter_ChatDefault_ResponseParsed]
  - struct: StreamEvent
    field: Text
    adapter: bedrock
    tests: [TestBedrockAdapter_ChatDefault_ResponseParsed]

