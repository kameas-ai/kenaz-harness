  # Reasoning — reasoning / thinking blocks
  - struct: Response
    field: Reasoning
    adapter: anthropic
    tests: [TestAnthropicAdapter_Reasoning_ReasoningParsed]
  - struct: Response
    field: Reasoning
    adapter: openai
    unsupported: "OpenAI reasoning is streaming-only chain-of-thought; no structured reasoning blocks in Response"
  - struct: Response
    field: Reasoning
    adapter: openrouter
    unsupported: "OpenRouter passes through upstream; no structured reasoning blocks surfaced at adapter layer"
  - struct: Response
    field: Reasoning
    adapter: bedrock
    unsupported: "Bedrock does not return structured reasoning blocks in the generic SDK shape"

  # FinishReason
  - struct: Response
    field: FinishReason
    adapter: anthropic
    tests: [TestAnthropicAdapter_ChatDefault_ResponseParsed]
  - struct: Response
    field: FinishReason
    adapter: openai
    tests: [TestOpenAIAdapter_ChatDefault_ResponseParsed]
  - struct: Response
    field: FinishReason
    adapter: openrouter
    tests: [TestOpenRouterAdapter_ChatDefault_ResponseParsed]
  - struct: Response
    field: FinishReason
    adapter: bedrock
    tests: [TestBedrockAdapter_ChatDefault_ResponseParsed]

  # Usage — token accounting
  - struct: Response
    field: Usage
    adapter: anthropic
    tests: [TestAnthropicAdapter_Usage_UsageParsed]
  - struct: Response
    field: Usage
    adapter: openai
    tests: [TestOpenAIAdapter_ChatDefault_ResponseParsed]
  - struct: Response
    field: Usage
    adapter: openrouter
    tests: [TestOpenRouterAdapter_ChatDefault_ResponseParsed]
  - struct: Response
    field: Usage
    adapter: bedrock
    tests: [TestBedrockAdapter_Usage_UsageParsed]

  # Cost — populated by registry CostReducer middleware, not adapters
  - struct: Response
    field: Cost
    adapter: anthropic
    unsupported: "populated by registry CostReducer middleware after adapter returns; not set by the adapter"
  - struct: Response
    field: Cost
    adapter: openai
    unsupported: "populated by registry CostReducer middleware after adapter returns; not set by the adapter"
  - struct: Response
    field: Cost
    adapter: openrouter
    unsupported: "populated by registry CostReducer middleware after adapter returns; not set by the adapter"
  - struct: Response
    field: Cost
    adapter: bedrock
    unsupported: "populated by registry CostReducer middleware after adapter returns; not set by the adapter"

  # Attempts — set by registry retry middleware
  - struct: Response
    field: Attempts
    adapter: anthropic
    unsupported: "set by registry retry middleware; individual adapters always return Attempts=0"
  - struct: Response
    field: Attempts
    adapter: openai
    unsupported: "set by registry retry middleware; individual adapters always return Attempts=0"
  - struct: Response
    field: Attempts
    adapter: openrouter
    unsupported: "set by registry retry middleware; individual adapters always return Attempts=0"
  - struct: Response
    field: Attempts
    adapter: bedrock
    unsupported: "set by registry retry middleware; individual adapters always return Attempts=0"

  # SnapshotID — eval system field; never returned by adapters
  - struct: Response
