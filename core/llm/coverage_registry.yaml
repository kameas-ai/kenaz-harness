    field: Reasoning
    adapter: openrouter
    unsupported: "OpenRouter passes through; reasoning not wired at adapter layer"
  - struct: GenerationRequest
    field: Reasoning
    adapter: bedrock
    unsupported: "Bedrock does not expose a top-level reasoning flag in the SDK input shape"
  - struct: GenerationRequest
    field: Reasoning
    adapter: azure-openai
    # WP08 (spec D-14): azure's req.Reasoning -> reasoning_effort mapping
    # moved into the shared openaiwire encoder; these three tests drive
    # azure's own Stream() end to end and assert the mapped value lands
    # on the wire.
    tests: [TestReasoning_RequestBody_High, TestReasoning_RequestBody_Medium, TestReasoning_RequestBody_Low]
  - struct: GenerationRequest
    field: Reasoning
    adapter: custom-openai
    unsupported: "Per-adapter wire-shape test pending. WP08 wires req.Reasoning -> reasoning_effort through the same shared openaiwire encoder custom-openai routes through (WP03), but no custom-specific test asserts it yet — custom-openai.yaml also sets reasoning: false by default (WP02), so the gate refuses before this would matter for the static baseline."

