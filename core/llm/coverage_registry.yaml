    field: ToolCalls
    adapter: anthropic
    tests: [TestAnthropicAdapter_ToolCall_ToolCallsParsed]
  - struct: Response
    field: ToolCalls
    adapter: openai
    tests: [TestOpenAIAdapter_StreamedToolCalls_ToolCallsParsed]
  - struct: Response
    field: ToolCalls
    adapter: openrouter
    tests: [TestOpenRouterAdapter_StreamedToolCalls_ToolCallsParsed]
  - struct: Response
    field: ToolCalls
    adapter: bedrock
