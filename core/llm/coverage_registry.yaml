  # gemini (structured-output-is-reachable-01PMZE14 WP05): NOT
  # gated by TestRegistryCompleteness's per-field loop — gemini is not
  # in inScopeAdapters (see registry_completeness_test.go's adapterDirs
  # comment). This entry exists so the cited test is verified to exist
  # (TestNames() checks every entry's tests: regardless of adapter
  # scope) and so a future widening of inScopeAdapters finds this row
  # already correct rather than missing.
  - struct: GenerationRequest
    field: JSONMode
    adapter: gemini
    tests: [TestJSONModeSpec_Schema_NoLongerDiscarded]
  - struct: GenerationRequest
    field: JSONMode
    adapter: azure-openai
    unsupported: "Per-adapter wire-shape test pending. WP03 hazard 3 (AC-019) notes applyJSONMode is now reachable through the shared encoder for this adapter; no azure-specific test asserts the emitted body shape yet."
  - struct: GenerationRequest
    field: JSONMode
    adapter: custom-openai
    unsupported: "Per-adapter wire-shape test pending. Same WP03 hazard as azure-openai above; custom-openai.yaml sets json_mode: false by default (WP02) and no test asserts the gate/encoder interaction yet."

  # ImageOutput — request-side opt-in for image generation
  # (multimodal-io-extended-01KQ8TD2). Per-adapter wire-shape coverage
  # is deferred — adapter-level support depends on provider-specific
  # endpoints (DALL-E 3, Titan Image, Stable Diffusion). End-to-end
  # capture pipeline behavior is covered by integration tests in
  # core/llm/multimodal_out_integration_test.go.
  - struct: GenerationRequest
    field: ImageOutput
    adapter: anthropic
    # Gate rejection contract — Anthropic models do not generate images
    # natively (anthropic.yaml: image_output: false on every model).
    # The adapter therefore never receives a request with ImageOutput
    # set; the load-bearing assertion lives in the capability gate.
    tests: [TestAnthropicAdapter_ImageOutput_RejectedByGate]
  - struct: GenerationRequest
    field: ImageOutput
    adapter: openai
    unsupported: "Per-adapter wire-shape test pending. Image-gen routes through dedicated endpoint (DALL-E 3 / gpt-image-1); chat-completion translator currently capability-gates. Integration coverage: core/llm/multimodal_out_integration_test.go."
  - struct: GenerationRequest
    field: ImageOutput
    adapter: openrouter
    unsupported: "Per-adapter wire-shape test pending. OpenRouter passthrough surface for image-gen models; integration coverage: core/llm/multimodal_out_integration_test.go."
  - struct: GenerationRequest
    field: ImageOutput
    adapter: bedrock
    unsupported: "Per-adapter wire-shape test pending. Image-gen routes through dedicated bedrock-runtime invoke (Titan Image, Stable Diffusion); chat-completion translator currently capability-gates. Integration coverage: core/llm/multimodal_out_integration_test.go."
  - struct: GenerationRequest
    field: ImageOutput
    adapter: azure-openai
    unsupported: "Per-adapter wire-shape test pending. Image-gen routes through a dedicated Azure OpenAI DALL-E deployment; chat-completion translator currently capability-gates. Integration coverage: core/llm/multimodal_out_integration_test.go."
  - struct: GenerationRequest
    field: ImageOutput
    adapter: custom-openai
    unsupported: "Per-adapter wire-shape test pending. custom-openai.yaml sets image_output: false by default (WP02) — an arbitrary OpenAI-compatible endpoint's image-gen surface, if any, is not modeled."

