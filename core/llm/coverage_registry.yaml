# coverage_registry.yaml — wire-shape test coverage matrix
#
# Schema: docs/coverage-registry-schema.md
# Completeness enforced by: core/llm/wirecheck/registry_completeness_test.go
#
# Every (struct, field, adapter) triple must have either:
#   tests: [<FuncName>, ...]      — at least one real test function
#   unsupported: "<reason>"       — explicit reason the adapter omits this field
#
# WP01 seeds every entry as unsupported: (suite green from day 0).
# WP02 flips entries to real tests: as the per-adapter sweep is implemented.
#
# Friction is the feature: adding a field to GenerationRequest/Response/StreamEvent
# without updating this file fails TestRegistryCompleteness with a clear message.
#
version: 1
entries:

  # ============================================================
  # GenerationRequest fields
  # ============================================================

  # ProfileID — internal routing key; never sent on the wire
  - struct: GenerationRequest
    field: ProfileID
    adapter: anthropic
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: openai
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: openrouter
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: bedrock
    unsupported: "internal routing key — never sent on the wire"

