  - struct: StreamEvent
    field: Tool
    adapter: openai
    tests: [TestOpenAIAdapter_StreamedToolCalls_ToolCallsParsed]
  - struct: StreamEvent
    field: Tool
    adapter: openrouter
    tests: [TestOpenRouterAdapter_StreamedToolCalls_ToolCallsParsed]
  - struct: StreamEvent
    field: Tool
    adapter: bedrock
    tests: [TestBedrockAdapter_StreamedToolCalls_ToolCallsParsed]

