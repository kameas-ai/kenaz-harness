# coverage_registry.yaml — wire-shape test coverage matrix
#
# Schema: docs/coverage-registry-schema.md
# Completeness enforced by: core/llm/wirecheck/registry_completeness_test.go
#
# Every (struct, field, adapter) triple must have either:
#   tests: [<FuncName>, ...]      — at least one real test function
#   unsupported: "<reason>"       — explicit reason the adapter omits this field
#
# WP02 replaced all WP01 placeholder rows with real test function references.
#
# Friction is the feature: adding a field to GenerationRequest/Response/StreamEvent
# without updating this file fails TestRegistryCompleteness with a clear message.
#
version: 1
entries:

  # ============================================================
  # GenerationRequest fields
  # ============================================================

  # ProfileID — internal routing key; never sent on the wire
  - struct: GenerationRequest
    field: ProfileID
    adapter: anthropic
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: openai
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: openrouter
    unsupported: "internal routing key — never sent on the wire"
  - struct: GenerationRequest
    field: ProfileID
    adapter: bedrock
    unsupported: "internal routing key — never sent on the wire"

  # Model — per-request model override; verified via URL path or request body
  - struct: GenerationRequest
    field: Model
    adapter: anthropic
    tests: [TestAnthropicAdapter_ModelOverride_ModelSerialized]
  - struct: GenerationRequest
    field: Model
    adapter: openai
    tests: [TestOpenAIAdapter_ModelOverride_ModelSerialized]
  - struct: GenerationRequest
    field: Model
    adapter: openrouter
    tests: [TestOpenRouterAdapter_ModelOverride_ModelSerialized]
  - struct: GenerationRequest
    field: Model
    adapter: bedrock
    tests: [TestBedrockAdapter_ModelOverride_ModelSerialized]

  # System — top-level system prompt
  - struct: GenerationRequest
    field: System
    adapter: anthropic
    tests: [TestAnthropicAdapter_SystemPrompt_SystemSerialized]
  - struct: GenerationRequest
    field: System
    adapter: openai
    tests: [TestOpenAIAdapter_SystemPrompt_SystemSerialized]
  - struct: GenerationRequest
    field: System
    adapter: openrouter
    tests: [TestOpenRouterAdapter_SystemPrompt_SystemSerialized]
  - struct: GenerationRequest
    field: System
    adapter: bedrock
    tests: [TestBedrockAdapter_SystemPrompt_SystemSerialized]

  # Messages — conversation history
  - struct: GenerationRequest
    field: Messages
    adapter: anthropic
    tests: [TestAnthropicAdapter_History_MessagesSerialized]
  - struct: GenerationRequest
    field: Messages
    adapter: openai
    tests: [TestOpenAIAdapter_History_MessagesSerialized]
  - struct: GenerationRequest
    field: Messages
    adapter: openrouter
    tests: [TestOpenRouterAdapter_History_MessagesSerialized]
  - struct: GenerationRequest
    field: Messages
    adapter: bedrock
    tests: [TestBedrockAdapter_History_MessagesSerialized]

  # Tools — tool specs
  - struct: GenerationRequest
    field: Tools
    adapter: anthropic
    tests: [TestAnthropicAdapter_Tools_ToolsSerialized]
  - struct: GenerationRequest
    field: Tools
    adapter: openai
    tests: [TestOpenAIAdapter_Tools_ToolsSerialized]
  - struct: GenerationRequest
    field: Tools
    adapter: openrouter
    tests: [TestOpenRouterAdapter_Tools_ToolsSerialized]
  - struct: GenerationRequest
    field: Tools
    adapter: bedrock
    tests: [TestBedrockAdapter_Tools_ToolsSerialized]

  # Attachments — multimodal inputs
  - struct: GenerationRequest
    field: Attachments
    adapter: anthropic
    tests: [TestAnthropicAdapter_Attachments_AttachmentsSerialized]
  - struct: GenerationRequest
    field: Attachments
    adapter: openai
    tests: [TestOpenAIAdapter_Attachments_AttachmentsSerialized]
  - struct: GenerationRequest
    field: Attachments
    adapter: openrouter
    tests: [TestOpenRouterAdapter_Attachments_AttachmentsSerialized]
  - struct: GenerationRequest
    field: Attachments
    adapter: bedrock
    tests: [TestBedrockAdapter_Attachments_AttachmentsSerialized]

  # JSONMode — legacy JSON-mode flag
  - struct: GenerationRequest
    field: JSONMode
    adapter: anthropic
    tests: [TestAnthropicAdapter_JSONMode_JSONModeSerialized]
  - struct: GenerationRequest
    field: JSONMode
    adapter: openai
    tests: [TestOpenAIAdapter_JSONMode_JSONModeSerialized]
  - struct: GenerationRequest
    field: JSONMode
    adapter: openrouter
    tests: [TestOpenRouterAdapter_JSONMode_JSONModeSerialized]
  - struct: GenerationRequest
    field: JSONMode
    adapter: bedrock
    tests: [TestBedrockAdapter_JSONMode_JSONModeSerialized]

  # Caching — prompt-caching breakpoints
  - struct: GenerationRequest
    field: Caching
    adapter: anthropic
    tests: [TestAnthropicAdapter_Caching_CachingSerialized]
  - struct: GenerationRequest
    field: Caching
    adapter: openai
    unsupported: "OpenAI does not expose prompt-caching breakpoints via API"
  - struct: GenerationRequest
    field: Caching
    adapter: openrouter
    unsupported: "OpenRouter passes through to upstream model; breakpoints not supported at this layer"
  - struct: GenerationRequest
    field: Caching
    adapter: bedrock
    unsupported: "Bedrock does not support prompt-caching breakpoints via the SDK input shape"

  # Reasoning — extended thinking / reasoning tokens
  - struct: GenerationRequest
    field: Reasoning
    adapter: anthropic
    tests: [TestAnthropicAdapter_Reasoning_ReasoningSerialized]
  - struct: GenerationRequest
    field: Reasoning
    adapter: openai
    unsupported: "OpenAI reasoning is model-native; no explicit reasoning flag on the wire"
  - struct: GenerationRequest
    field: Reasoning
    adapter: openrouter
    unsupported: "OpenRouter passes through; reasoning not wired at adapter layer"
  - struct: GenerationRequest
    field: Reasoning
    adapter: bedrock
    unsupported: "Bedrock does not expose a top-level reasoning flag in the SDK input shape"

  # ResponseFormat — structured output / grammar constraints
  - struct: GenerationRequest
    field: ResponseFormat
    adapter: anthropic
    tests: [TestAnthropicAdapter_ResponseFormat_ResponseFormatSerialized]
  - struct: GenerationRequest
    field: ResponseFormat
    adapter: openai
    tests: [TestOpenAIAdapter_ResponseFormat_ResponseFormatSerialized]
  - struct: GenerationRequest
    field: ResponseFormat
    adapter: openrouter
    tests: [TestOpenRouterAdapter_ResponseFormat_ResponseFormatSerialized]
  - struct: GenerationRequest
    field: ResponseFormat
    adapter: bedrock
    unsupported: "Bedrock response format is model-native; not wired at generic adapter layer"

  # Params — provider-specific knobs (temperature, top_p, max_tokens, etc.)
  - struct: GenerationRequest
    field: Params
    adapter: anthropic
    tests: [TestAnthropicAdapter_Params_ParamsSerialized]
  - struct: GenerationRequest
    field: Params
    adapter: openai
    tests: [TestOpenAIAdapter_Params_ParamsSerialized]
  - struct: GenerationRequest
    field: Params
    adapter: openrouter
    tests: [TestOpenRouterAdapter_Params_ParamsSerialized]
  - struct: GenerationRequest
    field: Params
    adapter: bedrock
    tests: [TestBedrockAdapter_Params_ParamsSerialized]

  # RetryOverride — consumed by registry middleware, not adapters
  - struct: GenerationRequest
    field: RetryOverride
    adapter: anthropic
    unsupported: "consumed by registry retry middleware before reaching the adapter"
  - struct: GenerationRequest
    field: RetryOverride
    adapter: openai
    unsupported: "consumed by registry retry middleware before reaching the adapter"
  - struct: GenerationRequest
    field: RetryOverride
    adapter: openrouter
    unsupported: "consumed by registry retry middleware before reaching the adapter"
  - struct: GenerationRequest
    field: RetryOverride
    adapter: bedrock
    unsupported: "consumed by registry retry middleware before reaching the adapter"

  # SessionID — internal session tracking; never sent on the wire
  - struct: GenerationRequest
    field: SessionID
    adapter: anthropic
    unsupported: "internal session tracking — never sent on the wire"
  - struct: GenerationRequest
    field: SessionID
    adapter: openai
    unsupported: "internal session tracking — never sent on the wire"
  - struct: GenerationRequest
    field: SessionID
    adapter: openrouter
    unsupported: "internal session tracking — never sent on the wire"
  - struct: GenerationRequest
    field: SessionID
    adapter: bedrock
    unsupported: "internal session tracking — never sent on the wire"

  # ============================================================
  # Response fields
  # ============================================================

  # Content — response content blocks
  - struct: Response
