    # reason was FALSE (spec §1.8) — bedrock wires ResponseFormat on
    # both transports. bedrock.go:227 injects a synthetic
    # "_structured_output" tool with forced ToolChoice for the SDK
    # path; bearer.go:936 mirrors it for the REST path. Corrected to
    # the real test functions.
    tests: [TestApplyResponseFormatToConverseInput_JSONSchema, TestApplyResponseFormatToConverseBodyJSON_JSONSchema]
  # gemini (structured-output-is-reachable-01PMZE14 WP05): see the
  # JSONMode row above for why this is scoped outside inScopeAdapters.
  - struct: GenerationRequest
    field: ResponseFormat
    adapter: gemini
    tests: [TestResponseFormat_JSONSchema_CarriesMimeTypeAndSchema, TestResponseFormat_Json_MimeTypeOnlyNoSchema, TestResponseFormat_Grammar_ReturnsTypedError]
  - struct: GenerationRequest
    field: ResponseFormat
    adapter: azure-openai
    unsupported: "Per-adapter wire-shape test pending. WP03 hazard 3 (AC-019) notes applyResponseFormat is now reachable through the shared encoder for this adapter; no azure-specific test asserts the emitted body shape yet."
  - struct: GenerationRequest
