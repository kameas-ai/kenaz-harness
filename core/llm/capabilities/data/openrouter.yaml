provider: openrouter
defaults:
  streaming: true
  tool_calling: true
  vision: false
  documents: false
  json_mode: true
  prompt_caching: false
  reasoning: false
  cancellation: true
  usage_reporting: true
  # Structured-output capability defaults (structured-output-and-grammar-01KX5R8A FR-002).
  # OpenRouter passes through provider-native structured output. Default false;
  # known models with reliable structured output are enabled per-model below.
  structured_output: false
  grammar: false
  regex_grammar: false
  # Image output capability (multimodal-io-extended-01KQ8TD2 WP05).
  # OpenRouter does not proxy image generation endpoints.
  image_output: false
  # Extended knob capabilities (provider-implementation-uniformity-01KQ8V4F WP06).
  # OpenRouter accepts OpenAI-style knobs for most routed models.
  parallel_tool_calls: true
  seed: true
  logprobs: false
  top_k: false
  top_p: true
  frequency_penalty: true
  presence_penalty: true
  batch: false
  response_format: true
  reasoning_style: ""
  # Attachment limits (multimodal-io-01KQ8TDF FR-006)
  # OpenRouter proxies to the underlying provider via OpenAI-shape requests.
  # image_url base64 data URLs work for vision-capable models.
  # PDFs are rejected by default; per-model overrides can flip document_input
  # for Claude-via-OpenRouter when that path is verified.
  image_input: false
  document_input: false
  max_image_bytes: 20971520          # mirrors OpenAI default
  max_document_bytes: 0
  max_image_count_per_message: 20
  max_image_pixels: 0
  max_document_pages: 0
  image_input_mime_types: [image/png, image/jpeg, image/gif, image/webp]
  document_input_mime_types: []
  # Size-tier default (versioned-model-profile-01PMDL04 WP04): any model
  # not matched below resolves here.
  tier: medium
# Size tiers (versioned-model-profile-01PMDL04 WP04) — see anthropic.yaml
# for the pattern. Only the row that previously hit a tierFromModelID
# keyword ("opus" -> large) is listed; the routed OpenAI/other Claude
# models matched no keyword under the old heuristic either, so they
# resolve via the medium default above — unchanged behaviour.
tiers:
  - match: "anthropic/claude-opus*"
    tier: large
models:
  # Claude-via-OpenRouter: vision + documents pass through to Anthropic
  - match: "anthropic/claude-sonnet*"
    streaming: true
    tool_calling: true
    vision: true
    documents: true
    json_mode: true
    prompt_caching: false
    reasoning: false
    cancellation: true
    usage_reporting: true
    structured_output: true
    grammar: false
    regex_grammar: false
    image_input: true
    document_input: true
    max_image_bytes: 5242880
    max_document_bytes: 33554432
    max_image_count_per_message: 100
    max_document_pages: 100
  - match: "anthropic/claude-opus*"
    streaming: true
    tool_calling: true
    vision: true
    documents: true
    json_mode: true
    prompt_caching: false
    reasoning: false
    cancellation: true
    usage_reporting: true
    structured_output: true
    grammar: false
    regex_grammar: false
    image_input: true
    document_input: true
    max_image_bytes: 5242880
    max_document_bytes: 33554432
    max_image_count_per_message: 100
    max_document_pages: 100
  - match: "anthropic/claude-3-5-sonnet*"
    streaming: true
    tool_calling: true
    vision: true
    documents: true
    json_mode: true
    prompt_caching: false
    reasoning: false
    cancellation: true
    usage_reporting: true
    image_input: true
    document_input: true
    max_image_bytes: 5242880
    max_document_bytes: 33554432
    max_image_count_per_message: 100
    max_document_pages: 100
  - match: "anthropic/claude*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    prompt_caching: false
    reasoning: false
    cancellation: true
    usage_reporting: true
    image_input: true
    document_input: false
    max_image_bytes: 5242880
    max_image_count_per_message: 20
  # GPT-4o-via-OpenRouter: vision, no documents, native structured output
  - match: "openai/gpt-4o*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    prompt_caching: false
    reasoning: false
    cancellation: true
    usage_reporting: true
    structured_output: true
    grammar: false
    regex_grammar: false
    image_input: true
    document_input: false
    max_image_bytes: 20971520
    max_image_count_per_message: 50
