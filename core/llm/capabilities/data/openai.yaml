    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    prompt_caching: false
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 128000
    max_output_tokens: 4096
  - match: "gpt-4-vision*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    prompt_caching: false
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 128000
    max_output_tokens: 4096
  - match: "o1*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    prompt_caching: false
    reasoning: true
    cancellation: true
    usage_reporting: true
    context_window: 200000
    max_output_tokens: 100000
  - match: "gpt-3.5-turbo*"
    streaming: true
    tool_calling: true
    vision: false
    documents: false
