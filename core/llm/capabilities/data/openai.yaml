    prompt_caching: false
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 16385
    max_output_tokens: 4096
  - match: "gpt-4*"
    streaming: true
    tool_calling: true
    vision: false
    documents: false
    json_mode: true
    prompt_caching: false
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 8192
    max_output_tokens: 8192
