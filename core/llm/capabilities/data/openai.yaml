provider: openai
defaults:
  streaming: true
  tool_calling: true
  vision: false
  documents: false
  json_mode: true
  reasoning: false
  cancellation: true
  usage_reporting: true
  # Structured-output capability defaults (structured-output-and-grammar-01KX5R8A FR-002).
  # OpenAI supports native response_format json_schema for gpt-4o+ models.
  # Grammar/GBNF is not supported by cloud providers.
  structured_output: false
  grammar: false
  regex_grammar: false
  # Image output capability default (multimodal-io-extended-01KQ8TD2 WP05).
  # False by default; only image-generation models (dall-e-3, gpt-image-1) set true.
  image_output: false
  # Extended knob capabilities (provider-implementation-uniformity-01KQ8V4F WP06).
  parallel_tool_calls: true
  seed: true
  logprobs: true
  top_k: false
  top_p: true
  frequency_penalty: true
  presence_penalty: true
  batch: false
  response_format: true
  reasoning_style: ""
  # Attachment limits (multimodal-io-01KQ8TDF FR-006)
  # Note: OpenAI Chat Completions does NOT accept PDF documents inline.
  # The Responses API does; that is a future follow-up mission.
  image_input: false
  document_input: false
  max_image_bytes: 20971520          # 20 MiB (OpenAI documented limit)
  max_document_bytes: 0
  max_image_count_per_message: 50
  max_image_pixels: 0
  max_document_pages: 0
  image_input_mime_types: [image/png, image/jpeg, image/gif, image/webp]
  document_input_mime_types: []
  # Size-tier default (versioned-model-profile-01PMDL04 WP04): any model
  # not matched below resolves here.
  tier: medium
# Size tiers (versioned-model-profile-01PMDL04 WP04) — the provider-owned
# replacement for core/agentgraph's historical tierFromModelID name
# matching. Exact (non-"*") rows double as the branch-recommender's v1
# stopgap known-model list (Catalog.KnownModels). More specific globs
# (gpt-4o-mini*) are listed before the broader glob they'd otherwise be
# shadowed by (gpt-4o*) since Tier/TierAny return on first match.
tiers:
  - match: "gpt-4o-mini"
    tier: small
  - match: "gpt-4o"
    tier: medium
  - match: "o1-preview"
    tier: large
  - match: "gpt-4o-mini*"
    tier: small
  - match: "gpt-4o*"
    tier: medium
  - match: "gpt-4-turbo*"
    tier: large
  - match: "gpt-4-vision*"
    tier: medium
  - match: "o1*"
    tier: large
  - match: "gpt-3.5-turbo*"
    tier: small
  - match: "gpt-4*"
    tier: medium
models:
  - match: "gpt-4o*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    reasoning: false
    cancellation: true
    usage_reporting: true
    structured_output: true
    grammar: false
    regex_grammar: false
    context_window: 128000
    max_output_tokens: 16384
    image_input: true
    document_input: false
    max_image_bytes: 20971520
    max_image_count_per_message: 50
  - match: "gpt-4-turbo*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 128000
    max_output_tokens: 4096
    image_input: true
    document_input: false
    max_image_bytes: 20971520
    max_image_count_per_message: 50
  - match: "gpt-4-vision*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 128000
    max_output_tokens: 4096
    image_input: true
    document_input: false
    max_image_bytes: 20971520
    max_image_count_per_message: 50
  # o1-mini (compaction-convergence-01PMDL05): more specific than "o1*"
  # below so it isn't shadowed — o1-mini's real context window (128000)
  # is smaller than the rest of the o1 family (200000). All other fields
  # are copied verbatim from the "o1*" row so this insertion changes
  # only the context_window value, not any other capability flag.
  - match: "o1-mini*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    reasoning: true
    reasoning_style: "effort_string"
    cancellation: true
    usage_reporting: true
    context_window: 128000
    max_output_tokens: 100000
    image_input: true
    document_input: false
    max_image_bytes: 20971520
    max_image_count_per_message: 50
  - match: "o1*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    reasoning: true
    reasoning_style: "effort_string"
    cancellation: true
    usage_reporting: true
    context_window: 200000
    max_output_tokens: 100000
    image_input: true
    document_input: false
    max_image_bytes: 20971520
    max_image_count_per_message: 50
  # o3 / o3-mini / gpt-4.1 / gpt-4.1-mini (compaction-convergence-01PMDL05):
  # these previously matched no row at all in this catalog (they'd fall
  # through to "gpt-4*" for the 4.1 pair, or to bare provider defaults
  # for o3/o3-mini), so Catalog.ContextWindow returned 8192 or 0 for a
  # real, shipping model. That gap is what forced core/compaction/wiring's
  # CapabilityLookup to keep its own hardcoded window table instead of
  # reading this catalog. Only `match` + `context_window` are set here —
  # every other field stays nil/unset so it inherits the provider-level
  # `defaults:` block exactly as it did before this row existed (this is
  # additive: a real context-window bug fix, not a capability-flag change).
  # Mini variant listed first so it isn't shadowed by the broader glob.
  - match: "gpt-4.1-mini*"
    context_window: 1000000
  - match: "gpt-4.1*"
    context_window: 1000000
  - match: "o3-mini*"
    context_window: 200000
  - match: "o3*"
    context_window: 200000
  - match: "gpt-3.5-turbo*"
    streaming: true
    tool_calling: true
    vision: false
    documents: false
    json_mode: true
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 16385
    max_output_tokens: 4096
    image_input: false
    document_input: false
  - match: "gpt-4*"
    streaming: true
    tool_calling: true
    vision: false
    documents: false
    json_mode: true
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 8192
    max_output_tokens: 8192
    image_input: false
    document_input: false
  # Image generation models (multimodal-io-extended-01KQ8TD2 WP05)
  # These do not support streaming, tool-calling, JSON mode, or text-chat caps;
  # they only accept a prompt and return image bytes.
  - match: "dall-e-3"
    streaming: false
    tool_calling: false
    vision: false
    documents: false
    json_mode: false
    reasoning: false
    cancellation: false
    usage_reporting: true
    structured_output: false
    grammar: false
    regex_grammar: false
    image_output: true
    image_input: false
    document_input: false
  - match: "gpt-image-1"
    streaming: false
    tool_calling: false
    vision: false
    documents: false
    json_mode: false
    reasoning: false
    cancellation: false
    usage_reporting: true
    structured_output: false
    grammar: false
    regex_grammar: false
    image_output: true
    image_input: false
    document_input: false
