provider: anthropic
defaults:
  streaming: true
  tool_calling: true
  vision: true
  documents: false
  json_mode: true
  prompt_caching: true
  reasoning: true
  cancellation: true
  usage_reporting: true
  # Structured-output capability defaults (structured-output-and-grammar-01KX5R8A FR-002).
  # Anthropic uses the tool-call workaround for json_schema mode; cloud providers
  # do not support GBNF grammar constraints.
  structured_output: false
  grammar: false
  regex_grammar: false
  # Image output capability (multimodal-io-extended-01KQ8TD2 WP05).
  # Anthropic does not offer an image-generation API.
  image_output: false
  # Extended knob capabilities (provider-implementation-uniformity-01KQ8V4F WP06).
  parallel_tool_calls: false
  seed: false
  logprobs: false
  top_k: true
  top_p: true
  frequency_penalty: false
  presence_penalty: false
  batch: false
  response_format: true
  reasoning_style: ""
  # Attachment limits (multimodal-io-01KQ8TDF FR-006)
  image_input: true
  document_input: false
  max_image_bytes: 5242880          # 5 MiB (Anthropic documented limit)
  max_document_bytes: 33554432      # 32 MiB
  max_image_count_per_message: 20
  max_image_pixels: 0               # 0 = unbounded (Anthropic recommends ≤1568px long-edge but doesn't hard-block)
  max_document_pages: 0             # 0 = unbounded default; overridden per-model below
  image_input_mime_types: [image/png, image/jpeg, image/gif, image/webp]
  document_input_mime_types: [application/pdf]
  # Size-tier default (versioned-model-profile-01PMDL04 WP04): any model
  # not matched below (or by an exact/glob row in tiers:) resolves here.
  tier: medium
# Size tiers (versioned-model-profile-01PMDL04 WP04) — the provider-owned
# replacement for core/agentgraph's historical tierFromModelID name
# matching. Exact (non-"*") rows double as the branch-recommender's v1
# stopgap known-model list (Catalog.KnownModels); glob rows classify
# other Claude models by family without needing an exact match.
tiers:
  - match: "claude-haiku-4"
    tier: small
  - match: "claude-sonnet-4"
    tier: medium
  - match: "claude-opus-4"
    tier: large
  - match: "claude-haiku-*"
    tier: small
  - match: "claude-sonnet-*"
    tier: medium
  - match: "claude-opus-*"
    tier: large
  - match: "claude-3-5-haiku*"
    tier: small
  - match: "claude-3-5-sonnet*"
    tier: medium
  - match: "claude-3-haiku*"
    tier: small
  - match: "claude-3-sonnet*"
    tier: medium
  - match: "claude-3-opus*"
    tier: large
models:
  - match: "claude-sonnet-*"
    streaming: true
    tool_calling: true
    vision: true
    documents: true
    json_mode: true
    prompt_caching: true
    reasoning: true
    reasoning_style: "token_budget"
    cancellation: true
    usage_reporting: true
    structured_output: true
    grammar: false
    regex_grammar: false
    context_window: 200000
    max_output_tokens: 64000
    image_input: true
    document_input: true
    max_image_bytes: 5242880
    max_document_bytes: 33554432
    max_image_count_per_message: 100
    max_document_pages: 100
