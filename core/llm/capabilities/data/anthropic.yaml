provider: anthropic
defaults:
  streaming: true
  tool_calling: true
  vision: true
  documents: false
  json_mode: true
  prompt_caching: true
  reasoning: true
  cancellation: true
  usage_reporting: true
  # Structured-output capability defaults (structured-output-and-grammar-01KX5R8A FR-002).
  # Anthropic uses the tool-call workaround for json_schema mode; cloud providers
  # do not support GBNF grammar constraints.
  structured_output: false
  grammar: false
  regex_grammar: false
  # Image output capability (multimodal-io-extended-01KQ8TD2 WP05).
  # Anthropic does not offer an image-generation API.
  image_output: false
  # Attachment limits (multimodal-io-01KQ8TDF FR-006)
  image_input: true
  document_input: false
  max_image_bytes: 5242880          # 5 MiB (Anthropic documented limit)
  max_document_bytes: 33554432      # 32 MiB
  max_image_count_per_message: 20
  max_image_pixels: 0               # 0 = unbounded (Anthropic recommends ≤1568px long-edge but doesn't hard-block)
  max_document_pages: 0             # 0 = unbounded default; overridden per-model below
  image_input_mime_types: [image/png, image/jpeg, image/gif, image/webp]
  document_input_mime_types: [application/pdf]
models:
  - match: "claude-sonnet-*"
    streaming: true
    tool_calling: true
    vision: true
    documents: true
    json_mode: true
    prompt_caching: true
    reasoning: true
    cancellation: true
    usage_reporting: true
    structured_output: true
    grammar: false
    regex_grammar: false
    context_window: 200000
    max_output_tokens: 64000
    image_input: true
    document_input: true
    max_image_bytes: 5242880
    max_document_bytes: 33554432
    max_image_count_per_message: 100
    max_document_pages: 100
  - match: "claude-opus-*"
    streaming: true
    tool_calling: true
    vision: true
    documents: true
    json_mode: true
    prompt_caching: true
    reasoning: true
    cancellation: true
    usage_reporting: true
    structured_output: true
    grammar: false
    regex_grammar: false
    context_window: 200000
    max_output_tokens: 32000
    image_input: true
    document_input: true
    max_image_bytes: 5242880
    max_document_bytes: 33554432
    max_image_count_per_message: 100
    max_document_pages: 100
  - match: "claude-haiku-*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    prompt_caching: true
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 200000
    max_output_tokens: 16000
    image_input: true
    document_input: false
    max_image_bytes: 5242880
    max_image_count_per_message: 20
  - match: "claude-3-5-sonnet*"
    streaming: true
    tool_calling: true
    vision: true
    documents: true
    json_mode: true
    prompt_caching: true
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 200000
    max_output_tokens: 8192
    image_input: true
    document_input: true
    max_image_bytes: 5242880
    max_document_bytes: 33554432
    max_image_count_per_message: 100
    max_document_pages: 100
  - match: "claude-3-5-haiku*"
    streaming: true
    tool_calling: true
    vision: true
    documents: false
    json_mode: true
    prompt_caching: true
    reasoning: false
    cancellation: true
    usage_reporting: true
    context_window: 200000
    max_output_tokens: 8192
    image_input: true
    document_input: false
    max_image_bytes: 5242880
    max_image_count_per_message: 20
  - match: "claude-3-haiku*"
    streaming: true
