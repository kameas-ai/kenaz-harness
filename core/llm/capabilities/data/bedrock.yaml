provider: bedrock
defaults:
  streaming: true
  tool_calling: true
  vision: false
  documents: false
  json_mode: false
  prompt_caching: false
  reasoning: false
  cancellation: true
  usage_reporting: true
  # Structured-output capability defaults (structured-output-and-grammar-01KX5R8A FR-002).
  # Bedrock uses tool-config workaround for Claude-family models. Grammar not supported.
  structured_output: false
  grammar: false
  regex_grammar: false
  # Image output capability default (multimodal-io-extended-01KQ8TD2 WP05).
  # False by default; only image-generation model prefixes set true.
  image_output: false
  # Extended knob capabilities (provider-implementation-uniformity-01KQ8V4F WP06).
  parallel_tool_calls: false
  seed: false
  logprobs: false
  top_k: true
  top_p: true
  frequency_penalty: false
  presence_penalty: false
  batch: false
  response_format: false
  reasoning_style: ""
  # Attachment limits (multimodal-io-01KQ8TDF FR-006)
  image_input: false
  document_input: false
  max_image_bytes: 3932160           # 3.75 MiB (Bedrock Converse image limit)
  max_document_bytes: 4718592        # 4.5 MiB (Bedrock document limit)
  max_image_count_per_message: 20
  max_image_pixels: 0
  max_document_pages: 0
  image_input_mime_types: [image/png, image/jpeg, image/gif, image/webp]
  document_input_mime_types: [application/pdf]
models:
  - match: "anthropic.claude-3-5-sonnet*"
    streaming: true
    tool_calling: true
    vision: true
    documents: true
    json_mode: true
    prompt_caching: true
    reasoning: false
    cancellation: true
    usage_reporting: true
    structured_output: true
    grammar: false
    regex_grammar: false
    context_window: 200000
    max_output_tokens: 8192
    image_input: true
    document_input: true
    max_image_bytes: 3932160
    max_document_bytes: 4718592
    max_image_count_per_message: 20
    max_document_pages: 100
